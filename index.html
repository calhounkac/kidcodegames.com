<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Let the Fun Begin — Choose a Game!</title>
  <style>
    body {
      margin: 0;
      font-family: "Comic Sans MS", sans-serif;
      background: linear-gradient(to bottom right, #007bff, #00cc66);
      color: white;
      text-align: center;
    }

    header img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-bottom: 4px solid white;
    }

    h1 {
      margin-top: 20px;
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 30px;
      padding: 40px;
    }

    .game {
      background: rgba(0,0,0,0.25);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      transition: transform 0.2s;
    }

    .game:hover {
      transform: scale(1.05);
    }

    .game img {
      width: 100%;
      border-radius: 12px;
      border: 2px solid white;
      cursor: pointer;
    }

    .platform-note {
      color: #fff;
      font-size: 0.9em;
      opacity: 0.8;
      margin-top: 10px;
    }

    footer {
      padding: 20px;
      background: rgba(0,0,0,0.3);
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <!-- Banner -->
  <header>
    <img src="assets/banner.png" alt="KidCode Games Banner">
  </header>

  <h1>KidCode Games</h1>

  <div class="game-grid">

    <!-- Game 1 -->
    <div class="game">
      <a href="assets/games/halloweenbowarrow.html">
        <img src="assets/screenshots/halloweenbowarrow.png" alt="Bow & Arrow">
      </a>
      <div class="platform-note">(Best on Mobile & Computer)</div>
    </div>

    <!-- Game 2 -->
    <div class="game">
      <a href="assets/games/slapshotdual.html">
        <img src="assets/screenshots/slapshotduel.png" alt="Slap Shot Duel">
      </a>
      <div class="platform-note">(Play on Mobile & Computer)</div>
    </div>

    <!-- Game 3 -->
    <div class="game">
      <a href="assets/games/airplane.html">
        <img src="assets/screenshots/airplanered.png" alt="Airplane">
      </a>
      <div class="platform-note">(Best on Computer)</div>
    </div>

    <!-- Game 4 -->
    <div class="game">
      <a href="assets/games/pixelracer.html">
        <img src="assets/screenshots/lightcycleclash.png" alt="Light Cycle Clash">
      </a>
      <div class="platform-note">(Best on Computer)</div>
    </div>

    <!-- Game 5 -->
    <div class="game">
      <a href="assets/games/shooterchase.html">
        <img src="assets/screenshots/shooterchase.png" alt="Shooter Chase">
      </a>
      <div class="platform-note">(Best on Computer)</div>
    </div>

    <!-- Game 6 -->
    <div class="game">
      <a href="assets/games/rapgame.html">
        <img src="assets/screenshots/rapgame.png" alt="Rap Battle">
      </a>
      <div class="platform-note">(Best on Mobile & Computer)</div>
    </div>

    <!-- Game 7 -->
    <div class="game">
      <a href="assets/games/frogjumper.html">
        <img src="assets/screenshots/frogjumper.png" alt="Frog Jumper">
      </a>
      <div class="platform-note">(Best on Mobile & Computer)</div>
    </div>

    <!-- Game 8 -->
    <div class="game">
      <a href="assets/games/snowboardrun.html">
        <img src="assets/screenshots/snowboardrun.png" alt="Snowboard Run">
      </a>
      <div class="platform-note">(Best on Computer)</div>
    </div>

  </div>

  <footer>© 2025 KidCode Games — Built with fun and creativity!</footer>

</body>
</html>
