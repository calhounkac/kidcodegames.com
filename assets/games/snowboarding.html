<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snowboard Dodge - Deadly Tunnels</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #e0f7ff;
      font-family: "Arial", sans-serif;
      user-select: none;
    }
    canvas {
      display: block;
      margin: auto;
      background: linear-gradient(to bottom, #cceeff 0%, #ffffff 100%);
      border: 3px solid #333;
    }
  </style>
</head>
<body>
  <canvas id="game" width="700" height="900"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // --- Player setup ---
    const player = {
      x: canvas.width / 2 - 25,
      y: canvas.height - 150,
      width: 60,
      height: 75,
      speed: 7,
      yVel: 0,
      gravity: 0.8,
      jumpStrength: -16,
      isJumping: false,
      trail: [],
    };

    // --- Obstacles ---
    let obstacles = [];
    let obstacleTimer = 0;
    let obstacleDelay = 50;
    const obstacleWidth = 90;
    const obstacleHeight = 90;

    // --- Game state ---
    let score = 0;
    let gameOver = false;
    const keys = {};

    // --- Snow particles ---
    let snowflakes = [];
    const snowCount = 100;

    for (let i = 0; i < snowCount; i++) {
      snowflakes.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1,
        speed: Math.random() * 2 + 0.5,
      });
    }

    // --- Controls ---
    document.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (e.code === "KeyR" && gameOver) resetGame();
    });
    document.addEventListener("keyup", (e) => (keys[e.code] = false));

    function resetGame() {
      player.x = canvas.width / 2 - 25;
      player.y = canvas.height - 150;
      player.yVel = 0;
      player.isJumping = false;
      obstacles = [];
      obstacleTimer = 0;
      score = 0;
      gameOver = false;
      obstacleDelay = 50;
    }

    // --- Spawning system ---
    function spawnObstacleRow() {
      const level = score;
      let types = ["tree", "rock"];

      if (level >= 35) types.push("stump");
      if (level >= 40 && Math.random() < 0.15) types.push("bridge"); // bridge now starts at level 40

      const tunnelChance = 0.15;
      const makeTunnel = Math.random() < tunnelChance;

      const numObstacles = makeTunnel ? 0 : Math.floor(Math.random() * 3) + 1;

      // Spawn tunnel
      if (makeTunnel) {
        const tunnelWidth = 180 + Math.random() * 100;
        const tunnelX = Math.random() * (canvas.width - tunnelWidth);
        obstacles.push({
          type: "tunnel",
          x: tunnelX,
          y: -150,
          w: tunnelWidth,
          h: 120,
        });
      }

      // Spawn multiple obstacles at same height
      for (let i = 0; i < numObstacles; i++) {
        const type = types[Math.floor(Math.random() * types.length)];
        const x = Math.random() * (canvas.width - obstacleWidth);
        const y = -obstacleHeight;

        if (type === "bridge") {
          const w = Math.random() * 250 + 200;
          const bx = Math.random() * (canvas.width - w);
          obstacles.push({ type: "bridge", x: bx, y: y, w, h: 40 });
        } else {
          obstacles.push({ type, x, y, w: obstacleWidth, h: obstacleHeight });
        }
      }
    }

    // --- Snow movement ---
    function drawSnow() {
      ctx.fillStyle = "#fff";
      snowflakes.forEach((s) => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        s.y += s.speed;
        if (s.y > canvas.height) {
          s.y = -5;
          s.x = Math.random() * canvas.width;
        }
      });
    }

    // --- Game updates ---
    function update() {
      if (gameOver) return;

      // Movement
      if ((keys["ArrowLeft"] || keys["KeyA"]) && player.x > 0) player.x -= player.speed;
      if ((keys["ArrowRight"] || keys["KeyD"]) && player.x < canvas.width - player.width) player.x += player.speed;
      if (keys["Space"] && !player.isJumping) {
        player.yVel = player.jumpStrength;
        player.isJumping = true;
      }

      // Gravity
      player.yVel += player.gravity;
      player.y += player.yVel;

      // Floor
      const floorY = canvas.height - player.height - 50;
      if (player.y > floorY) {
        player.y = floorY;
        player.yVel = 0;
        player.isJumping = false;
      }

      // Trail
      player.trail.push({ x: player.x + player.width / 2, y: player.y + player.height });
      if (player.trail.length > 15) player.trail.shift();

      // Difficulty scaling
      const level = Math.floor(score / 15);
      obstacleDelay = Math.max(20, 50 - level * 5);

      // Spawning
      obstacleTimer++;
      if (obstacleTimer >= obstacleDelay) {
        obstacleTimer = 0;
        spawnObstacleRow();
      }

      // Move obstacles
      obstacles.forEach((obs) => (obs.y += 9));

      // Remove off-screen & increment score
      obstacles = obstacles.filter((obs) => {
        if (obs.y > canvas.height) {
          if (obs.type !== "tunnel") score++;
          return false;
        }
        return true;
      });

      // --- Collision detection ---
      obstacles.forEach((obs) => {
        const px = player.x;
        const py = player.y;
        const pw = player.width;
        const ph = player.height;

        if (obs.type === "bridge") return; // safe

        // Tunnel hazard logic
        if (obs.type === "tunnel") {
          const leftWall = { x: 0, y: obs.y, w: obs.x, h: obs.h };
          const rightWall = { x: obs.x + obs.w, y: obs.y, w: canvas.width - (obs.x + obs.w), h: obs.h };

          const hitLeft =
            px < leftWall.x + leftWall.w &&
            px + pw > leftWall.x &&
            py < leftWall.y + leftWall.h &&
            py + ph > leftWall.y;

          const hitRight =
            px < rightWall.x + rightWall.w &&
            px + pw > rightWall.x &&
            py < rightWall.y + rightWall.h &&
            py + ph > rightWall.y;

          if (hitLeft || hitRight) {
            obs.hit = true;
            gameOver = true;
          }
          return;
        }

        // Regular obstacle collision
        const collided =
          px < obs.x + obs.w &&
          px + pw > obs.x &&
          py < obs.y + obs.h &&
          py + ph > obs.y;

        if (collided) {
          obs.hit = true;
          gameOver = true;
        }
      });
    }

    // --- Drawing functions ---
    function drawPlayer() {
      // Trail
      ctx.strokeStyle = "rgba(200,200,255,0.3)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      for (let i = 0; i < player.trail.length - 1; i++) {
        const t1 = player.trail[i];
        const t2 = player.trail[i + 1];
        ctx.moveTo(t1.x, t1.y);
        ctx.lineTo(t2.x, t2.y);
      }
      ctx.stroke();

      // Snowboard
      ctx.fillStyle = "#222";
      ctx.fillRect(player.x - 12, player.y + player.height - 5, player.width + 24, 8);
      ctx.fillStyle = "#cc0000";
      ctx.fillRect(player.x - 12, player.y + player.height - 5, player.width + 24, 3);

      // Body
      const gradient = ctx.createLinearGradient(player.x, player.y, player.x, player.y + player.height);
      gradient.addColorStop(0, "#0077cc");
      gradient.addColorStop(1, "#004499");
      ctx.fillStyle = gradient;
      ctx.fillRect(player.x + 8, player.y + 15, player.width - 16, player.height - 15);

      // Arms
      ctx.strokeStyle = "#004477";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(player.x + 8, player.y + 25);
      ctx.lineTo(player.x - 5, player.y + 40);
      ctx.moveTo(player.x + player.width - 8, player.y + 25);
      ctx.lineTo(player.x + player.width + 5, player.y + 40);
      ctx.stroke();

      // Head
      ctx.beginPath();
      ctx.arc(player.x + player.width / 2, player.y + 10, 12, 0, Math.PI * 2);
      ctx.fillStyle = "#f8d7b0";
      ctx.fill();
      ctx.fillStyle = "#444";
      ctx.fillRect(player.x + player.width / 2 - 12, player.y + 4, 24, 8);
      ctx.fillStyle = "#00aaff";
      ctx.fillRect(player.x + player.width / 2 - 10, player.y + 5, 20, 6);
      ctx.strokeStyle = "#222";
      ctx.strokeRect(player.x + player.width / 2 - 10, player.y + 5, 20, 6);
    }

    function drawObstacles() {
      obstacles.forEach((obs) => {
        if (obs.type === "tree") {
          ctx.fillStyle = obs.hit ? "#ff0000" : "#2d5d13";
          ctx.beginPath();
          ctx.moveTo(obs.x + obstacleWidth / 2, obs.y);
          ctx.lineTo(obs.x, obs.y + obstacleHeight);
          ctx.lineTo(obs.x + obstacleWidth, obs.y + obstacleHeight);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "#5b3a1a";
          ctx.fillRect(obs.x + obstacleWidth / 2 - 6, obs.y + obstacleHeight, 12, 15);
        } else if (obs.type === "rock") {
          ctx.fillStyle = obs.hit ? "#ff0000" : "#444";
          ctx.beginPath();
          ctx.ellipse(obs.x + obstacleWidth / 2, obs.y + obstacleHeight / 2, 30, 25, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#777";
          ctx.beginPath();
          ctx.ellipse(obs.x + obstacleWidth / 2 - 10, obs.y + obstacleHeight / 2 - 10, 10, 8, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (obs.type === "stump") {
          ctx.fillStyle = obs.hit ? "#ff0000" : "#4b2a0a";
          ctx.fillRect(obs.x + 15, obs.y + 30, 60, 40);
          ctx.fillStyle = "#3b1a00";
          ctx.fillRect(obs.x + 20, obs.y + 20, 50, 10);
        } else if (obs.type === "bridge") {
          ctx.fillStyle = "#a07a4f";
          ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
          ctx.strokeStyle = "#6b4b2a";
          ctx.lineWidth = 2;
          for (let i = obs.x; i < obs.x + obs.w; i += 25) {
            ctx.beginPath();
            ctx.moveTo(i, obs.y);
            ctx.lineTo(i, obs.y + obs.h);
            ctx.stroke();
          }
        } else if (obs.type === "tunnel") {
          // Left + Right wall
          ctx.fillStyle = obs.hit ? "#ff0000" : "#555";
          ctx.fillRect(0, obs.y, obs.x, obs.h);
          ctx.fillRect(obs.x + obs.w, obs.y, canvas.width - (obs.x + obs.w), obs.h);
          ctx.fillStyle = "#222";
          ctx.fillRect(obs.x, obs.y, obs.w, 10);
        }
      });
    }

    function drawHUD() {
      ctx.fillStyle = "#000";
      ctx.font = "26px Arial";
      ctx.fillText("Score: " + score, 20, 40);
      if (gameOver) {
        ctx.fillStyle = "#ff3333";
        ctx.font = "56px Arial";
        ctx.fillText("Game Over", canvas.width / 2 - 160, canvas.height / 2 - 40);
        ctx.fillStyle = "#000";
        ctx.font = "30px Arial";
        ctx.fillText("Final Score: " + score, canvas.width / 2 - 100, canvas.height / 2 + 10);
        ctx.fillStyle = "#777";
        ctx.fillText("Press R to Restart", canvas.width / 2 - 130, canvas.height / 2 + 50);
      }
    }

    function drawBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, "#bde0ff");
      grad.addColorStop(1, "#ffffff");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // --- Main loop ---
    function gameLoop() {
      drawBackground();
      drawSnow();
      update();
      drawObstacles();
      drawPlayer();
      drawHUD();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
