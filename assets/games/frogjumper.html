<!DOCTYPE html>
<html>
<head>
  <title>Frog Jumper Arcade</title>
  <meta charset="UTF-8" />
  <!-- Make layout match device width so media queries work on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
  html, body {
  height: 100%;
  margin: 0;
}

body {
  background: #000;
  display: flex;
  flex-direction: column;      /* Stack canvas + controls vertically */
  align-items: center;
  justify-content: flex-start; /* Game stays toward the top */
  font-family: monospace;
  padding-top: 10px;           /* Small nudge down from very top */
}

canvas {
  border: 4px solid #333;
  background: #000;
  image-rendering: pixelated;
  max-width: 100%;
  height: auto;
}

    /* ===== MOBILE CONTROLS ===== */
    #mobileControls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;              /* Show by default */
      flex-direction: column;
      align-items: center;
      z-index: 999;
      user-select: none;
      touch-action: manipulation;
    }

    .mc-row {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .mc-btn {
      background: rgba(255,255,255,0.25);
      border: 2px solid #fff;
      color: #fff;
      font-size: 32px;
      padding: 18px 24px;
      border-radius: 14px;
      margin: 6px;
      width: 72px;
      height: 72px;
      backdrop-filter: blur(5px);
    }

    .mc-btn:active {
      background: rgba(255,255,255,0.45);
    }

    /* Hide controls on big desktop screens */
    @media only screen and (min-width: 1000px) {
      #mobileControls { display: none; }
    }
  </style>
</head>
<body>
<canvas id="game" width="624" height="720"></canvas>

<!-- MOBILE CONTROLS -->
<div id="mobileControls">
  <button class="mc-btn" id="btnUp">▲</button>
  <div class="mc-row">
    <button class="mc-btn" id="btnLeft">◀</button>
    <button class="mc-btn" id="btnDown">▼</button>
    <button class="mc-btn" id="btnRight">▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const context = canvas.getContext("2d");

const grid = 48;
const gridGap = 10;
const GOAL_SLOTS = 5;

let currentLevel = 0;
const levelCount = 10; // 10 levels total

// movement cooldown to make jumps snappy
let canMove = true;
const MOVE_COOLDOWN = 110; // ms between jumps

// hop animation
const HOP_FRAMES = 10;

// lives + GAME OVER
let lives = 3;
let gameOver = false;

// score + timer + best
let score = 0;
let bestScore = 0;
let levelStartTime = Date.now();
let lastLevelBonusText = "";

// --------- SOUND SETUP (SFX + MUSIC) ---------
let soundEnabled = true;   // SFX
let musicEnabled = true;   // background music
let musicInitialized = false; // start music only after first keypress

// Sound effects (place wav files in same folder)
const sounds = {
  hop: new Audio("hop.wav"),
  splash: new Audio("splash.wav"),
  hit: new Audio("hit.wav"),
  home: new Audio("home.wav"),
  levelUp: new Audio("levelup.wav"),
  gameOver: new Audio("gameover.wav")
};

// Background music (looped) – MAKE SURE you have bgmusic.wav
const bgMusic = new Audio("bgmusic.wav");
bgMusic.loop = true;
bgMusic.volume = 0.4; // softer than SFX

function playSound(name) {
  if (!soundEnabled) return;
  const s = sounds[name];
  if (!s) return;
  try {
    s.currentTime = 0;
    s.play();
  } catch (e) {
    // ignore play errors (e.g., autoplay restrictions)
  }
}

function updateMusic() {
  if (!musicEnabled) {
    bgMusic.pause();
    return;
  }
  try {
    bgMusic.play();
  } catch (e) {
    // ignore errors; user may have to press another key to satisfy autoplay rules
  }
}

// try to load best score from localStorage (if available)
try {
  const saved = localStorage.getItem("froggerBestScore");
  if (saved) {
    bestScore = parseInt(saved, 10) || 0;
  }
} catch (e) {
  // ignore storage errors
}

function updateBestScore() {
  if (score > bestScore) {
    bestScore = score;
    try {
      localStorage.setItem("froggerBestScore", bestScore.toString());
    } catch (e) {
      // ignore storage write errors
    }
  }
}

// --------- COLOR PALETTES PER LEVEL ---------

// Logs palette per level (we'll cycle through with modulo)
const logPalettes = [
  { base: "#8b5a2b", mid: "#b57939", dark: "#5c3b1b" },   // Palette A
  { base: "#5b3c1a", mid: "#a86b3f", dark: "#3d2610" },   // Palette B
  { base: "#3f2b18", mid: "#916237", dark: "#26160b" }    // Palette C
];

// Vehicles palette per level (also cycles)
const vehiclePalettes = [
  { car: "#c2c4da", truck: "#b3b7ff", bulldozer: "#f1c40f" }, // Palette A
  { car: "#ff9f43", truck: "#54a0ff", bulldozer: "#feca57" }, // Palette B
  { car: "#ff6b81", truck: "#5f27cd", bulldozer: "#ff9f43" }  // Palette C
];

// --------- BASIC SPRITE "CLASS" ---------
function Sprite(props) {
  Object.assign(this, props);
}

Sprite.prototype.render = function () {
  switch (this.type) {
    case "frog":
      drawFrog(this);
      break;
    case "log":
      drawLog(this);
      break;
    case "turtle":
      drawTurtle(this);
      break;
    case "car":
    case "truck":
    case "bulldozer":
      drawVehicle(this);
      break;
    default:
      context.fillStyle = this.color;
      context.fillRect(
        this.x,
        this.y + gridGap / 2,
        this.size,
        grid - gridGap
      );
  }
};

// --------- DRAWING HELPERS ---------

function drawPixelRect(x, y, w, h, color) {
  context.fillStyle = color;
  context.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function drawFrog(s) {
  const cellX = s.x;
  const cellY = s.y;
  const pad = 6;
  const w = grid - pad * 2;
  const h = grid - pad * 2;

  // hop offset
  let hopOffset = 0;
  if (s.hopTimer && s.hopTimer > 0) {
    const t = s.hopTimer / HOP_FRAMES;     // 1 -> 0
    const phase = 1 - t;                   // 0 -> 1
    hopOffset = -8 * Math.sin(Math.PI * phase); // smooth up/down arc
  }

  const x = cellX + pad;
  const y = cellY + pad + hopOffset;

  // body (medium green)
  drawPixelRect(x, y + h * 0.25, w, h * 0.5, "#37b34a");

  // legs
  drawPixelRect(x - 4, y + h * 0.3, 6, h * 0.4, "#2d8b3c");
  drawPixelRect(x + w - 2, y + h * 0.3, 6, h * 0.4, "#2d8b3c");
  drawPixelRect(x + w * 0.2, y + h * 0.75, w * 0.2, 6, "#2d8b3c");
  drawPixelRect(x + w * 0.6, y + h * 0.75, w * 0.2, 6, "#2d8b3c");

  // head
  drawPixelRect(x + w * 0.1, y, w * 0.8, h * 0.35, "#3fd35a");

  // eyes
  drawPixelRect(x + 3, y - 4, 8, 8, "#ffffff");
  drawPixelRect(x + w - 11, y - 4, 8, 8, "#ffffff");
  drawPixelRect(x + 6, y - 2, 4, 4, "#000000");
  drawPixelRect(x + w - 9, y - 2, 4, 4, "#000000");

  // belly
  drawPixelRect(x + w * 0.25, y + h * 0.4, w * 0.5, h * 0.25, "#a8fbb8");
}

function drawLog(s) {
  const palIndex = currentLevel % logPalettes.length;
  const palette = logPalettes[palIndex];
  const cellX = s.x;
  const cellY = s.y;
  const y = cellY + gridGap / 2 + 6;
  const h = grid - gridGap - 12;
  const w = s.size;

  drawPixelRect(cellX, y, w, h, palette.base);
  drawPixelRect(cellX, y + 4, w, 4, palette.mid);
  drawPixelRect(cellX, y + h - 8, w, 4, palette.dark);

  for (let i = 0; i < w; i += 20) {
    drawPixelRect(cellX + i + 4, y + h * 0.3, 8, 2, "#c99352");
    drawPixelRect(cellX + i + 10, y + h * 0.6, 8, 2, "#c99352");
  }
}

function drawTurtle(s) {
  const cellX = s.x;
  const cellY = s.y;
  const y = cellY + gridGap / 2 + 8;
  const h = grid - gridGap - 16;
  const w = s.size;

  drawPixelRect(cellX + 10, y, w - 20, h, "#1a5b39");
  drawPixelRect(cellX + 12, y + 4, w - 24, h - 8, "#227447");

  drawPixelRect(cellX + w / 2 - 8, y + h / 2 - 8, 16, 16, "#2f945a");
  drawPixelRect(cellX + w / 2 - 4, y + h / 2 - 4, 8, 8, "#38b06b");

  drawPixelRect(cellX + w - 6, y + h / 2 - 4, 10, 8, "#38b06b");
  drawPixelRect(cellX + w - 2, y + h / 2 - 2, 3, 3, "#000000");
}

function drawVehicle(s) {
  const cellX = s.x;
  const cellY = s.y;
  const y = cellY + gridGap / 2 + 8;
  const h = grid - gridGap - 16;
  const w = s.size;

  const palIndex = currentLevel % vehiclePalettes.length;
  const vp = vehiclePalettes[palIndex];

  let bodyColor;
  if (s.type === "truck") {
    bodyColor = vp.truck;
  } else if (s.type === "bulldozer") {
    bodyColor = vp.bulldozer;
  } else {
    bodyColor = vp.car;
  }

  let accent = "#ffffff";
  let windowColor = "#b4e6ff";

  drawPixelRect(cellX, y + 8, w, h - 10, bodyColor);

  const cabW = Math.min(w * 0.4, w - 12);
  const cabX = s.speed > 0 ? cellX + w - cabW : cellX;
  drawPixelRect(cabX, y, cabW, h - 8, bodyColor);

  drawPixelRect(cabX + 4, y + 4, cabW - 8, (h - 12) / 2, windowColor);

  drawPixelRect(cellX + 8, y + h - 2, 10, 6, "#000000");
  drawPixelRect(cellX + w - 18, y + h - 2, 10, 6, "#000000");

  if (s.type === "bulldozer") {
    const bladeX = s.speed > 0 ? cellX + w - 4 : cellX - 4;
    drawPixelRect(bladeX, y + 6, 4, h - 4, accent);
  } else {
    const bumpX = s.speed > 0 ? cellX + w - 4 : cellX;
    drawPixelRect(bumpX, y + 10, 4, h - 10, accent);
  }

  const headY = y + 10;
  if (s.speed > 0) {
    drawPixelRect(cellX + w - 6, headY, 4, 4, "#ffffa3");
  } else {
    drawPixelRect(cellX + 2, headY, 4, 4, "#ffffa3");
  }
}

// --------- GAME OBJECTS ---------

const frogger = new Sprite({
  x: grid * 6,
  y: grid * 13,
  size: grid,
  type: "frog",
  hopTimer: 0
});

const scoredFroggers = [];

// Base pattern sets (we'll reuse & speed-scale for all 10 levels)
const levelPatterns = [
  [
    null,
    { spacing: [2],     color: "#c55843", size: grid * 3, shape: "rect", speed: 0.7,  type: "log" },
    { spacing: [1,3],   color: "#de0004", size: grid,     shape: "circle", speed: -0.9, type: "turtle" },
    { spacing: [3],     color: "#c55843", size: grid * 4, shape: "rect", speed: 1.1,  type: "log" },
    { spacing: [2,4],   color: "#c55843", size: grid * 2, shape: "rect", speed: -0.6, type: "log" },
    { spacing: [0,2,0], color: "#de0004", size: grid,     shape: "circle", speed: 0.9,  type: "turtle" },
    null,
    { spacing: [3,7],   color: "#c2c4da", size: grid * 2, shape: "rect", speed: -0.9, type: "truck" },
    { spacing: [6,8],   color: "#c2c4da", size: grid,     shape: "rect", speed: 0.8,  type: "car" },
    { spacing: [3,4,6], color: "#de3cdd", size: grid,     shape: "rect", speed: -0.8, type: "car" },
    { spacing: [4,6],   color: "#0bcb00", size: grid,     shape: "rect", speed: 0.7,  type: "bulldozer" },
    { spacing: [4],     color: "#e5e401", size: grid,     shape: "rect", speed: -0.7, type: "car" },
    null
  ],
  [
    null,
    { spacing: [1,2],   color: "#a86b3f", size: grid * 3, shape: "rect", speed: 1.0, type: "log" },
    { spacing: [1,1,2], color: "#ff5f5f", size: grid,     shape: "circle", speed: -1.2, type: "turtle" },
    { spacing: [2,3],   color: "#a86b3f", size: grid * 4, shape: "rect", speed: 1.5, type: "log" },
    { spacing: [2,3],   color: "#a86b3f", size: grid * 2, shape: "rect", speed: -0.9, type: "log" },
    { spacing: [0,1,0,2], color: "#ff5f5f", size: grid,   shape: "circle", speed: 1.1, type: "turtle" },
    null,
    { spacing: [2,5],   color: "#c2c4da", size: grid * 2, shape: "rect", speed: -1.2, type: "truck" },
    { spacing: [6,7],   color: "#c2c4da", size: grid,     shape: "rect", speed: 1.1,  type: "car" },
    { spacing: [2,4,5], color: "#de3cdd", size: grid,     shape: "rect", speed: -1.1, type: "car" },
    { spacing: [2,5],   color: "#0bcb00", size: grid,     shape: "rect", speed: 1.0,  type: "bulldozer" },
    { spacing: [3],     color: "#e5e401", size: grid,     shape: "rect", speed: -1.0, type: "car" },
    null
  ],
  [
    null,
    { spacing: [1,1,2],   color: "#7b532e", size: grid * 3, shape: "rect", speed: 1.4, type: "log" },
    { spacing: [1,1,1,2], color: "#ff4b5c", size: grid,     shape: "circle", speed: -1.5, type: "turtle" },
    { spacing: [2],       color: "#7b532e", size: grid * 4, shape: "rect", speed: 1.9,  type: "log" },
    { spacing: [1,2,2],   color: "#7b532e", size: grid * 2, shape: "rect", speed: -1.4, type: "log" },
    { spacing: [0,1,0,1], color: "#ff4b5c", size: grid,     shape: "circle", speed: 1.6, type: "turtle" },
    null,
    { spacing: [2,4,6],   color: "#c2c4da", size: grid * 2, shape: "rect", speed: -1.8, type: "truck" },
    { spacing: [5,6],     color: "#c2c4da", size: grid,     shape: "rect", speed: 1.7,  type: "car" },
    { spacing: [2,3,4],   color: "#de3cdd", size: grid,     shape: "rect", speed: -1.8, type: "car" },
    { spacing: [2,4],     color: "#0bcb00", size: grid,     shape: "rect", speed: 1.6,  type: "bulldozer" },
    { spacing: [2,3],     color: "#e5e401", size: grid,     shape: "rect", speed: -1.7, type: "car" },
    null
  ]
];

// Get pattern set for a given level (cycle through the 3 bases)
function getPatternsForLevel(levelIndex) {
  const idx = levelIndex % levelPatterns.length;
  return levelPatterns[idx];
}

let patterns = getPatternsForLevel(currentLevel);
const rows = [];
let levelMessageTimer = 0;

// --------- BUILD ROWS FROM PATTERNS ---------
function buildRowsFromPatterns() {
  rows.length = 0;

  // Difficulty multiplier grows with level: 1.0, 1.2, ... up to ~2.8
  const difficultyMultiplier = 1 + currentLevel * 0.2;

  for (let i = 0; i < patterns.length; i++) {
    rows[i] = [];
    const pat = patterns[i];
    if (!pat) continue;

    let x = 0;
    let idx = 0;

    const totalPatternWidth =
      pat.spacing.reduce((acc, s) => acc + s, 0) * grid +
      pat.spacing.length * pat.size;

    let endX = 0;
    while (endX < canvas.width) {
      endX += totalPatternWidth;
    }
    endX += totalPatternWidth;

    while (x < endX) {
      const baseSpeed = pat.speed;
      const scaledSpeed = baseSpeed * difficultyMultiplier;

      rows[i].push(
        new Sprite({
          x,
          y: grid * (i + 1),
          index: idx,
          ...pat,
          speed: scaledSpeed  // override with scaled speed
        })
      );
      x += pat.size + pat.spacing[idx] * grid;
      idx = (idx + 1) % pat.spacing.length;
    }
  }
}

buildRowsFromPatterns();

// --------- RIVER GRADIENT ---------
const riverGradient = context.createLinearGradient(0, grid, 0, grid * 7);
riverGradient.addColorStop(0, "#001a5b");
riverGradient.addColorStop(0.5, "#003c8f");
riverGradient.addColorStop(1, "#00103a");

// --------- HELPERS ---------
function resetFrog() {
  frogger.x = grid * 6;
  frogger.y = grid * 13;
  frogger.speed = 0;
  frogger.hopTimer = 0;
}

function resetGameToStart() {
  currentLevel = 0;
  patterns = getPatternsForLevel(currentLevel);
  scoredFroggers.length = 0;
  lives = 3;
  gameOver = false;
  score = 0;                // reset score on full restart
  lastLevelBonusText = "";
  buildRowsFromPatterns();
  resetFrog();
  levelStartTime = Date.now(); // reset timer
  levelMessageTimer = 120;
}

function advanceLevel() {
  playSound("levelUp");

  // move to next level until 10, then stay at 10 but keep looping patterns / bonuses
  if (currentLevel < levelCount - 1) {
    currentLevel++;
  } else {
    currentLevel = levelCount - 1; // stay at max difficulty
  }

  patterns = getPatternsForLevel(currentLevel);
  scoredFroggers.length = 0;
  buildRowsFromPatterns();

  // base + time bonus
  const elapsedSec = ((Date.now() - levelStartTime) / 1000) | 0;
  const baseBonus = 500;
  const timeBonus = Math.max(0, (60 - elapsedSec) * 5); // faster = more
  score += baseBonus + timeBonus;
  updateBestScore();

  lastLevelBonusText = "Bonus: +" + baseBonus +
    (timeBonus > 0 ? "  Time Bonus: +" + timeBonus : "");

  resetFrog();
  levelStartTime = Date.now(); // new timer for new level
  levelMessageTimer = 120;
}

function loseLife(cause) {
  if (gameOver) return;

  // choose sound based on cause
  if (cause === "water") {
    playSound("splash");
  } else if (cause === "car") {
    playSound("hit");
  }

  lives--;
  if (lives <= 0) {
    lives = 0;
    gameOver = true;
    playSound("gameOver");
    resetFrog();
  } else {
    resetFrog();
  }
}

// --------- MAIN LOOP ---------
function loop() {
  requestAnimationFrame(loop);
  context.clearRect(0, 0, canvas.width, canvas.height);

  if (frogger.hopTimer && frogger.hopTimer > 0) {
    frogger.hopTimer--;
  }

  // BACKGROUND:
  context.fillStyle = "#2c004f";
  context.fillRect(0, 0, canvas.width, grid);

  context.fillStyle = riverGradient;
  context.fillRect(0, grid, canvas.width, grid * 5);

  context.strokeStyle = "rgba(255,255,255,0.12)";
  context.lineWidth = 1;
  for (let ry = grid + 8; ry < grid * 6; ry += 16) {
    context.beginPath();
    for (let rx = 0; rx <= canvas.width; rx += 24) {
      context.moveTo(rx, ry);
      context.quadraticCurveTo(rx + 6, ry - 4, rx + 12, ry);
    }
    context.stroke();
  }

  context.fillStyle = "#003d00";
  context.fillRect(0, grid, canvas.width, grid);

  const slotWidth = grid * 1.6;
  const gap = grid * 0.8;
  const totalSlotsWidth = GOAL_SLOTS * slotWidth + (GOAL_SLOTS - 1) * gap;
  const startX = (canvas.width - totalSlotsWidth) / 2;

  for (let i = 0; i < GOAL_SLOTS; i++) {
    const sx = startX + i * (slotWidth + gap);
    context.fillStyle = "#001700";
    context.fillRect(sx, grid + 4, slotWidth, grid - 8);

    context.fillStyle = "#1b8f36";
    context.beginPath();
    context.arc(sx + slotWidth / 2, grid + grid / 2, 12, 0, Math.PI * 2);
    context.fill();
    context.fillStyle = "#0f4f1e";
    context.beginPath();
    context.moveTo(sx + slotWidth / 2, grid + grid / 2);
    context.arc(
      sx + slotWidth / 2,
      grid + grid / 2,
      12,
      -Math.PI / 4,
      Math.PI / 4
    );
    context.closePath();
    context.fill();
  }

  context.fillStyle = "#d2b96b";
  context.fillRect(0, 7 * grid, canvas.width, grid);

  const roadTop = 8 * grid;
  const roadHeight = 5 * grid;

  context.fillStyle = "#111111";
  context.fillRect(0, roadTop, canvas.width, roadHeight);

  context.fillStyle = "#ffffff";
  context.fillRect(0, roadTop + 3, canvas.width, 3);
  context.fillRect(0, roadTop + roadHeight - 6, canvas.width, 3);

  context.fillStyle = "#cfcfcf";
  const lanes = 4;
  for (let ln = 1; ln < lanes; ln++) {
    const ly = roadTop + (roadHeight / lanes) * ln;
    for (let x = 0; x < canvas.width; x += 40) {
      context.fillRect(x + 10, ly - 1, 20, 2);
    }
  }

  context.fillStyle = "#005800";
  context.fillRect(0, canvas.height - grid * 2, canvas.width, grid);
  context.fillStyle = "#003f00";
  context.fillRect(0, canvas.height - grid * 3, canvas.width, 4);

  // UPDATE & DRAW ROWS
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    const pat = patterns[r];
    if (!pat) continue;

    for (let i = 0; i < row.length; i++) {
      const sprite = row[i];

      sprite.x += sprite.speed;
      sprite.render();

      if (sprite.speed < 0 && sprite.x < -sprite.size) {
        let rightMost = sprite;
        for (let j = 0; j < row.length; j++) {
          if (row[j].x > rightMost.x) rightMost = row[j];
        }
        const spacing = pat.spacing;
        sprite.x =
          rightMost.x + rightMost.size + spacing[rightMost.index] * grid;
        sprite.index = (rightMost.index + 1) % spacing.length;
      }

      if (sprite.speed > 0 && sprite.x > canvas.width) {
        let leftMost = sprite;
        for (let j = 0; j < row.length; j++) {
          if (row[j].x < leftMost.x) leftMost = row[j];
        }
        const spacing = pat.spacing;
        let idx = leftMost.index - 1;
        if (idx < 0) idx = spacing.length - 1;
        sprite.x = leftMost.x - spacing[idx] * grid - sprite.size;
        sprite.index = idx;
      }
    }
  }

  // MOVE FROG WITH LOG/TURTLE SPEED IF STANDING ON ONE
  frogger.x += frogger.speed || 0;

  // DRAW FROGS
  frogger.render();
  scoredFroggers.forEach((f) => f.render());

  // COLLISION + SCORING only if not gameOver
  const froggerRow = (frogger.y / grid) - 1 | 0;
  if (!gameOver) {
    let collision = false;

    if (froggerRow >= 0 && froggerRow < rows.length && rows[froggerRow]) {
      const row = rows[froggerRow];

      for (let i = 0; i < row.length; i++) {
        const s = row[i];

        if (
          frogger.x < s.x + s.size - gridGap &&
          frogger.x + grid - gridGap > s.x &&
          frogger.y < s.y + grid &&
          frogger.y + grid > s.y
        ) {
          collision = true;

          if (froggerRow > rows.length / 2) {
            loseLife("car");
          } else {
            // safe on log/turtle
            frogger.speed = s.speed;
          }
        }
      }

      // in water rows but not on log/turtle
      if (!collision && froggerRow > 0 && froggerRow <= 5) {
        loseLife("water");
      }
    }

    if (!collision) {
      frogger.speed = 0;
    }

    // HOME / GOAL SLOT HANDLING
    if (froggerRow === 0) {
      const frogCenterX = frogger.x + grid / 2;
      const slotCenters = [];
      for (let i = 0; i < GOAL_SLOTS; i++) {
        const sx = startX + i * (slotWidth + gap);
        slotCenters.push(sx + slotWidth / 2);
      }

      let bestIndex = 0;
      let bestDiff = Infinity;
      for (let i = 0; i < slotCenters.length; i++) {
        const d = Math.abs(frogCenterX - slotCenters[i]);
        if (d < bestDiff) {
          bestDiff = d;
          bestIndex = i;
        }
      }

      const targetX = slotCenters[bestIndex] - grid / 2;

      if (!scoredFroggers.find((f) => f.x === targetX)) {
        scoredFroggers.push(
          new Sprite({
            ...frogger,
            x: targetX,
            y: frogger.y + 4,
            type: "frog",
            hopTimer: 0
          })
        );

        // sound + score for reaching home
        playSound("home");
        score += 100;  // score for each home reached
        updateBestScore();

        if (scoredFroggers.length >= GOAL_SLOTS) {
          advanceLevel();
        } else {
          resetFrog();
        }
      } else {
        resetFrog();
      }
    }
  }

  // --------- CLEAN HUD ---------
  const elapsedSec = ((Date.now() - levelStartTime) / 1000) | 0;

  // HUD background only top row (doesn't cover homes)
  context.fillStyle = "rgba(0,0,0,0.9)";
  context.fillRect(0, 0, canvas.width, grid);

  context.fillStyle = "#ffffff";
  context.font = "16px monospace";

  // Row 1: Center only
  context.textAlign = "center";
  const controlText =
    "Arrows move  |  M: SFX " + (soundEnabled ? "ON" : "OFF") +
    "  |  B: Music " + (musicEnabled ? "ON" : "OFF") +
    "  |  Level " + (currentLevel + 1) + "/10";
  context.fillText(
    controlText,
    canvas.width / 2,
    20
  );

  // Row 2: Left and right
  context.textAlign = "left";
  context.fillText(
    "Homes: " + scoredFroggers.length + "/" + GOAL_SLOTS +
    "   Lives: " + lives,
    10,
    40
  );

  context.textAlign = "right";
  context.fillText(
    "Score: " + score,
    canvas.width - 10,
    40
  );

  // Row 3: right side only
  context.textAlign = "right";
  context.fillText(
    "Best: " + bestScore +
    "   Time: " + elapsedSec + "s",
    canvas.width - 10,
    56
  );

  // LEVEL MESSAGE
  if (levelMessageTimer > 0) {
    levelMessageTimer--;
    context.fillStyle = "rgba(0,0,0,0.7)";
    context.fillRect(0, canvas.height / 2 - 80, canvas.width, 160);
    context.fillStyle = "#ffe66b";
    context.font = "28px monospace";
    context.textAlign = "center";
    context.fillText(
      "LEVEL " + (currentLevel + 1),
      canvas.width / 2,
      canvas.height / 2 - 20
    );
    context.font = "18px monospace";
    context.fillStyle = "#ffffff";
    context.fillText(
      "All homes filled! New traffic & river pattern.",
      canvas.width / 2,
      canvas.height / 2 + 6
    );
    if (lastLevelBonusText) {
      context.fillText(
        lastLevelBonusText,
        canvas.width / 2,
        canvas.height / 2 + 34
      );
    }
  }

  // GAME OVER OVERLAY
  if (gameOver) {
    const t = Date.now() / 400;
    const green = Math.floor(160 + 95 * Math.sin(t));
    const pink = Math.floor(160 + 95 * Math.sin(t + Math.PI));

    const mainColor = `rgb(${pink}, ${Math.floor(pink * 0.4)}, ${pink})`;
    const glowColor = `rgb(${Math.floor(green * 0.4)}, ${green}, ${Math.floor(green * 0.4)})`;

    context.fillStyle = "rgba(0,0,0,0.75)";
    context.fillRect(0, canvas.height / 2 - 110, canvas.width, 220);

    context.textAlign = "center";
    context.font = "54px monospace";
    context.shadowBlur = 20;
    context.shadowColor = glowColor;
    context.fillStyle = mainColor;
    context.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);

    context.shadowBlur = 0;
    context.fillStyle = "#ffffff";
    context.font = "20px monospace";
    context.fillText(
      "Final Score: " + score,
      canvas.width / 2,
      canvas.height / 2 + 4
    );
    context.fillText(
      "Best Score: " + bestScore,
      canvas.width / 2,
      canvas.height / 2 + 30
    );
    context.fillText(
      "Press Enter to restart",
      canvas.width / 2,
      canvas.height / 2 + 60
    );
  }

  frogger.x = Math.min(Math.max(0, frogger.x), canvas.width - grid);
  frogger.y = Math.min(
    Math.max(grid, frogger.y),
    canvas.height - grid * 2
  );
}

// --------- INPUT (movement + SFX/Music + restart) ---------
document.addEventListener("keydown", (e) => {
  // On first keypress, try starting music (for autoplay policies)
  if (!musicInitialized) {
    musicInitialized = true;
    updateMusic();
  }

  // Restart on Enter if GAME OVER
  if (gameOver) {
    if (e.key === "Enter") {
      resetGameToStart();
    }
    return;
  }

  // Toggle SFX with M
  if (e.key === "m" || e.key === "M") {
    soundEnabled = !soundEnabled;
    return;
  }

  // Toggle music with B
  if (e.key === "b" || e.key === "B") {
    musicEnabled = !musicEnabled;
    updateMusic();
    return;
  }

  if (!canMove) return;

  let moved = false;

  if (e.key === "ArrowLeft") {
    frogger.x -= grid;
    moved = true;
  } else if (e.key === "ArrowRight") {
    frogger.x += grid;
    moved = true;
  } else if (e.key === "ArrowUp") {
    frogger.y -= grid;
    moved = true;
  } else if (e.key === "ArrowDown") {
    frogger.y += grid;
    moved = true;
  }

  if (moved) {
    frogger.x = Math.min(Math.max(0, frogger.x), canvas.width - grid);
    frogger.y = Math.min(
      Math.max(grid, frogger.y),
      canvas.height - grid * 2
    );

    frogger.hopTimer = HOP_FRAMES;

    // play hop sound
    playSound("hop");

    canMove = false;
    setTimeout(() => {
      canMove = true;
    }, MOVE_COOLDOWN);
  }
});

// ===== MOBILE BUTTON HANDLERS =====
function mobileMove(direction) {
  const event = new KeyboardEvent("keydown", { key: direction });
  document.dispatchEvent(event);
}

const btnUp = document.getElementById("btnUp");
const btnDown = document.getElementById("btnDown");
const btnLeft = document.getElementById("btnLeft");
const btnRight = document.getElementById("btnRight");

function addMobileListener(btn, key) {
  if (!btn) return;
  btn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    mobileMove(key);
  }, { passive: false });

  btn.addEventListener("click", (e) => {
    e.preventDefault();
    mobileMove(key);
  });
}

addMobileListener(btnUp, "ArrowUp");
addMobileListener(btnDown, "ArrowDown");
addMobileListener(btnLeft, "ArrowLeft");
addMobileListener(btnRight, "ArrowRight");

// --------- START ---------
levelMessageTimer = 120;
levelStartTime = Date.now();
requestAnimationFrame(loop);
</script>
