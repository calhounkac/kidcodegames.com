<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade Snowboard Run - Custom Rider</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #001427;
      font-family: "Arial", sans-serif;
      user-select: none;
      touch-action: none; /* prevent scroll on mobile while using controls */
    }
    canvas {
      display: block;
      margin: auto;
      background: #001427;
      border: 3px solid #ffffff;
    }

    /* --- MOBILE CONTROLS (LEFT / JUMP / RIGHT) --- */
    #mobile-controls {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 999;
    }

    #mobile-controls button {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
    }

    #mobile-controls button:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.2);
    }

    /* --- RESTART + BACK TO KIDCODE --- */
    #meta-buttons {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 999;
      flex-wrap: wrap;
      justify-content: center;
    }

    #meta-buttons button {
      min-width: 120px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 2px solid #ffffff;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    #meta-buttons button:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.2);
    }

    /* Slightly smaller on tiny phones */
    @media (max-width: 480px) {
      #mobile-controls button {
        width: 60px;
        height: 60px;
        font-size: 26px;
      }
      #meta-buttons button {
        min-width: 110px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
<canvas id="game" width="700" height="900"></canvas>

<!-- MOBILE CONTROLS -->
<div id="mobile-controls">
  <button id="btn-left">⟵</button>
  <button id="btn-jump">⤒</button>
  <button id="btn-right">⟶</button>
</div>

<!-- RESTART + BACK BUTTONS -->
<div id="meta-buttons">
  <button id="btn-restart">🔁 Restart</button>
  <button id="btn-home">🏠 Back to KidCode</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// --- Slope layout ---
const slopeTopY = 80;
const slopeLeftX = 90;
const slopeRightX = canvas.width - 90;
const PLAYER_SCREEN_Y = slopeTopY + 140;

// --- Color option sets ---
const jacketOptions = [
  { name: "Sky Blue", top: "#00b4d8", bottom: "#0077b6" },
  { name: "Fire Red", top: "#ff5252", bottom: "#e53935" },
  { name: "Neon Green", top: "#64dd17", bottom: "#1b5e20" },
  { name: "Royal Purple", top: "#ab47bc", bottom: "#7b1fa2" }
];

const pantsOptions = [
  { name: "Charcoal", color: "#263238" },
  { name: "Black", color: "#000000" },
  { name: "Gray", color: "#616161" },
  { name: "Navy", color: "#1a237e" }
];

const gloveOptions = [
  { name: "Yellow", color: "#ffeb3b" },
  { name: "White", color: "#ffffff" },
  { name: "Orange", color: "#ff9800" },
  { name: "Cyan", color: "#00e5ff" }
];

const boardOptions = [
  { name: "Orange", color: "#ff6d00" },
  { name: "Purple", color: "#8e24aa" },
  { name: "Lime", color: "#c6ff00" },
  { name: "Red", color: "#e53935" }
];

// Helmet follows jacket tone, boots neutral
const currentSelection = {
  jacketIndex: 0,
  pantsIndex: 0,
  gloveIndex: 0,
  boardIndex: 0
};

function getCurrentColors() {
  const j = jacketOptions[currentSelection.jacketIndex];
  const p = pantsOptions[currentSelection.pantsIndex];
  const g = gloveOptions[currentSelection.gloveIndex];
  const b = boardOptions[currentSelection.boardIndex];
  return {
    jacketTop: j.top,
    jacketBottom: j.bottom,
    pants: p.color,
    boots: "#212121",
    helmet: "#37474f",
    accent: g.color,
    board: b.color
  };
}

// --- Player (emoji-style snowboarder) ---
const player = {
  baseX: canvas.width / 2 - 14,
  baseY: PLAYER_SCREEN_Y,
  width: 24,
  height: 40,
  speedX: 7,
  jumpOffset: 0,
  jumpVel: 0,
  gravity: 1.0,
  isJumping: false,
  trickTimer: 0,
  isFlipping: false,
  flipAngle: 0,
  flipSpeed: 0
};

let obstacles = [];
let score = 0;
let lives = 5; // 5 lives
let level = 1;
const MAX_LEVEL = 10;

let state = "menu"; // "menu","countdown","playing","celebrate","gameOver","champion"
let countdownFrames = 180;
let celebrateFrames = 0;
let globalFrame = 0;
let framesSinceRunStart = 0;

let finishObj = null;
let cameraY = 0;
let trackLength = 0;
const keys = {};

let trickPopups = [];

// Snow particles
const snowflakes = [];
for (let i = 0; i < 140; i++) {
  snowflakes.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2 + 1,
    speed: Math.random() * 1.5 + 0.5
  });
}

// Input - keyboard
document.addEventListener("keydown", (e) => {
  keys[e.code] = true;

  if (state === "menu") {
    if (e.code === "Enter" || e.code === "Space") {
      startFromMenuIfReady();
    }
  }

  if (e.code === "KeyR" && (state === "gameOver" || state === "champion")) {
    resetGame();
  }
});

document.addEventListener("keyup", (e) => {
  keys[e.code] = false;
});

// --- MOBILE / MOUSE BUTTON CONTROLS ---
const btnLeft = document.getElementById("btn-left");
const btnRight = document.getElementById("btn-right");
const btnJump = document.getElementById("btn-jump");
const btnRestart = document.getElementById("btn-restart");
const btnHome = document.getElementById("btn-home");

function addButtonControl(button, keyCode) {
  if (!button) return;

  const press = (e) => {
    e.preventDefault();
    keys[keyCode] = true;
  };
  const release = (e) => {
    e.preventDefault();
    keys[keyCode] = false;
  };

  button.addEventListener("mousedown", press);
  button.addEventListener("mouseup", release);
  button.addEventListener("mouseleave", release);

  button.addEventListener("touchstart", press, { passive: false });
  button.addEventListener("touchend", release, { passive: false });
  button.addEventListener("touchcancel", release, { passive: false });
}

// Map mobile buttons to same keys game already uses
addButtonControl(btnLeft, "ArrowLeft");
addButtonControl(btnRight, "ArrowRight");
addButtonControl(btnJump, "Space");

// Restart button: go back to menu and reset full game
if (btnRestart) {
  const handleRestart = (e) => {
    e.preventDefault();
    resetGame();
  };
  btnRestart.addEventListener("click", handleRestart);
  btnRestart.addEventListener("touchstart", handleRestart, { passive: false });
}

// Back to KidCode index (assuming this file is in assets/games/)
if (btnHome) {
  const handleHome = (e) => {
    e.preventDefault();
    window.location.href = "../../index.html";
  };
  btnHome.addEventListener("click", handleHome);
  btnHome.addEventListener("touchstart", handleHome, { passive: false });
}

// Menu click for color selection
canvas.addEventListener("click", (e) => {
  if (state !== "menu") return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  handleMenuClick(x, y);
});

// Helpers
function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// Game flow
function resetGame() {
  state = "menu";
  level = 1;
  lives = 5;
  score = 0;
  obstacles = [];
  trickPopups = [];
}

function startFromMenuIfReady() {
  level = 1;
  lives = 5;
  score = 0;
  countdownFrames = 180;
  startLevel();
  state = "countdown";
}

function startLevel() {
  player.baseX = canvas.width / 2 - player.width / 2;
  player.baseY = PLAYER_SCREEN_Y;
  player.jumpOffset = 0;
  player.jumpVel = 0;
  player.isJumping = false;
  player.trickTimer = 0;
  player.isFlipping = false;
  player.flipAngle = 0;
  player.flipSpeed = 0;

  cameraY = 0;
  framesSinceRunStart = 0;
  trickPopups = [];

  generateLevel(level);
}

function generateLevel(lv) {
  obstacles = [];
  finishObj = null;

  const baseTrack = 2600;
  const extraPerLevel = 900;
  trackLength = baseTrack + (lv - 1) * extraPerLevel;

  const rows = 10 + lv * 3;
  const spacing = (trackLength - 500) / rows;
  const SAFE_START_WORLD_Y = 800;

  // Center/lanes obstacles with themed types per level
  for (let i = 0; i < rows; i++) {
    const rowY = SAFE_START_WORLD_Y + i * spacing;
    const numInRow = Math.random() < 0.3 ? 2 : 1;

    for (let j = 0; j < numInRow; j++) {
      const laneWidth = slopeRightX - slopeLeftX - 80;
      const x = slopeLeftX + 40 + Math.random() * (laneWidth - 60);

      let types = ["tree", "rock"];
      if (lv >= 2) types.push("stump");
      if (lv >= 3) types.push("flagPair");
      if (lv >= 4) types.push("ice");
      if (lv >= 6) types.push("fence");
      if (lv >= 8) types.push("snowman");

      const type = types[Math.floor(Math.random() * types.length)];

      if (type === "flagPair") {
        const gateWidth = 120;
        const gx = slopeLeftX + 40 + Math.random() * (laneWidth - gateWidth);
        obstacles.push({ type: "flagLeft", x: gx, y: rowY, w: 12, h: 60 });
        obstacles.push({ type: "flagRight", x: gx + gateWidth, y: rowY, w: 12, h: 60 });
      } else {
        obstacles.push({ type, x, y: rowY, w: 60, h: 60, hit: false });
      }
    }

    // Jumps sprinkled down the middle areas
    if (Math.random() < 0.6) {
      const laneWidthJ = slopeRightX - slopeLeftX - 120;
      const jx = slopeLeftX + 60 + Math.random() * laneWidthJ;
      obstacles.push({
        type: "jump",
        x: jx,
        y: rowY - 40,
        w: 80,
        h: 26
      });
    }
  }

  // Extra: side-wall obstacles to block easy straight-line riding down the edges
  const sideRows = 14 + lv * 2;
  const sideSpacing = (trackLength - 600) / sideRows;
  for (let i = 0; i < sideRows; i++) {
    const rowY = SAFE_START_WORLD_Y + i * sideSpacing;

    // Left side band
    let leftTypes = ["tree", "rock"];
    if (lv >= 4) leftTypes.push("ice");
    if (lv >= 6) leftTypes.push("fence");
    if (lv >= 8) leftTypes.push("snowman");
    const leftType = leftTypes[Math.floor(Math.random() * leftTypes.length)];
    const leftX = slopeLeftX + 10 + Math.random() * 50;
    obstacles.push({
      type: leftType,
      x: leftX,
      y: rowY,
      w: 50,
      h: 60,
      hit: false
    });

    // Right side band
    let rightTypes = leftTypes;
    const rightType = rightTypes[Math.floor(Math.random() * rightTypes.length)];
    const rightX = slopeRightX - 60 - Math.random() * 50;
    obstacles.push({
      type: rightType,
      x: rightX,
      y: rowY,
      w: 50,
      h: 60,
      hit: false
    });
  }

  // Big ramp right before finish for stylish ending
  const bigRampY = trackLength - 140;
  const centerLane = (slopeLeftX + slopeRightX) / 2;
  obstacles.push({
    type: "jumpBig",
    x: centerLane - 70,
    y: bigRampY,
    w: 140,
    h: 36
  });

  // Finish line
  finishObj = {
    type: "finish",
    x: slopeLeftX + 10,
    y: trackLength,
    w: slopeRightX - slopeLeftX - 20,
    h: 28
  };
}

function handleCrash() {
  if (state !== "playing") return;
  lives -= 1;
  if (lives <= 0) {
    state = "gameOver";
  } else {
    countdownFrames = 120;
    state = "countdown";
    startLevel();
  }
}

function handleLevelComplete() {
  if (state !== "playing") return;
  state = "celebrate";
  celebrateFrames = 90;
  triggerFlipCelebration();
}

// Trick helpers & popups
function setTrickStyle(source) {
  const dir = level % 2 === 0 ? 1 : -1;
  if (source === "manual") {
    player.flipSpeed = (Math.PI * 2) / 40 * dir;
  } else if (source === "ramp") {
    player.flipSpeed = (Math.PI * 2) / 28 * dir;
  } else if (source === "bigRamp") {
    player.flipSpeed = (Math.PI * 4) / 60 * dir;
  } else if (source === "celebrate") {
    player.flipSpeed = (Math.PI * 2) / 20 * dir;
  }
}

function addTrickPopup(text, offsetY) {
  trickPopups.push({
    text,
    offsetY: offsetY || 0,
    life: 45
  });
}

function triggerManualJump() {
  player.isJumping = true;
  player.jumpVel = -14;
  player.trickTimer = 30;
  player.isFlipping = true;
  player.flipAngle = 0;
  setTrickStyle("manual");
  addTrickPopup("360!", -10);
}

function triggerRampJump(big = false) {
  player.isJumping = true;
  if (big) {
    player.jumpVel = -24;
    player.trickTimer = 70;
    setTrickStyle("bigRamp");
    addTrickPopup("720!", -10);
    addTrickPopup("BIG AIR!", -40);
  } else {
    player.jumpVel = -20;
    player.trickTimer = 45;
    setTrickStyle("ramp");
    addTrickPopup("360!", -10);
    addTrickPopup("BIG AIR!", -35);
  }
  player.isFlipping = true;
  player.flipAngle = 0;
}

function triggerFlipCelebration() {
  player.isFlipping = true;
  player.flipAngle = 0;
  player.trickTimer = 0;
  setTrickStyle("celebrate");
  addTrickPopup("BIG AIR!", -40);
}

// Background
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, "#001427");
  grad.addColorStop(0.4, "#023047");
  grad.addColorStop(1, "#457b9d");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(slopeLeftX - 40, slopeTopY);
  ctx.lineTo(slopeRightX + 40, slopeTopY);
  ctx.lineTo(slopeRightX, canvas.height);
  ctx.lineTo(slopeLeftX, canvas.height);
  ctx.closePath();
  const snowGrad = ctx.createLinearGradient(0, slopeTopY, 0, canvas.height);
  snowGrad.addColorStop(0, "#ffffff");
  snowGrad.addColorStop(1, "#e0f7ff");
  ctx.fillStyle = snowGrad;
  ctx.fill();

  ctx.strokeStyle = "rgba(0,0,0,0.4)";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(slopeLeftX, slopeTopY);
  ctx.lineTo(slopeLeftX, canvas.height);
  ctx.moveTo(slopeRightX, slopeTopY);
  ctx.lineTo(slopeRightX, canvas.height);
  ctx.stroke();
  ctx.restore();

  // Distant mountains
  ctx.fillStyle = "#002438";
  ctx.beginPath();
  ctx.moveTo(40, 220);
  ctx.lineTo(180, 60);
  ctx.lineTo(320, 220);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(380, 260);
  ctx.lineTo(540, 80);
  ctx.lineTo(680, 260);
  ctx.closePath();
  ctx.fill();
}

function drawSnowAndSpeedLines() {
  ctx.fillStyle = "#ffffff";
  snowflakes.forEach((s) => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
    s.y += s.speed;
    if (s.y > canvas.height) {
      s.y = -5;
      s.x = Math.random() * canvas.width;
    }
  });

  if (state === "playing" && framesSinceRunStart > 60) {
    const intensity = 4 + level;
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 2;
    for (let i = 0; i < intensity; i++) {
      const offsetX = (Math.random() - 0.5) * 120;
      const startX = player.baseX + player.width / 2 + offsetX;
      const startY = player.baseY + player.height / 2 - 30 + player.jumpOffset;
      const length = 30 + Math.random() * 40;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(startX, startY - length);
      ctx.stroke();
    }
  }
}

// Update
function updateGame() {
  const baseSpeed = 3.2 + level * 0.4;
  let downhillSpeed = baseSpeed;
  if (framesSinceRunStart < 60) {
    downhillSpeed = baseSpeed * (framesSinceRunStart / 60);
  }

  if ((keys["ArrowLeft"] || keys["KeyA"]) && player.baseX > slopeLeftX + 10) {
    player.baseX -= player.speedX;
  }
  if ((keys["ArrowRight"] || keys["KeyD"]) && player.baseX + player.width < slopeRightX - 10) {
    player.baseX += player.speedX;
  }

  if (keys["Space"] && !player.isJumping) {
    triggerManualJump();
  }

  if (player.isJumping) {
    player.jumpVel += player.gravity;
    player.jumpOffset += player.jumpVel;
    if (player.jumpOffset >= 0) {
      player.jumpOffset = 0;
      player.isJumping = false;
    }
  }

  if (player.trickTimer > 0) {
    player.trickTimer--;
    player.isFlipping = true;
    player.flipAngle += player.flipSpeed;
    if (player.trickTimer <= 0 && state !== "celebrate") {
      player.isFlipping = false;
      player.flipAngle = 0;
      player.flipSpeed = 0;
    }
  }

  cameraY += downhillSpeed;
  score += Math.floor(downhillSpeed * 0.3);

  if (finishObj) {
    const finishScreenY = finishObj.y - cameraY;
    const px = player.baseX;
    const py = player.baseY + player.jumpOffset;
    const pw = player.width;
    const ph = player.height;
    if (rectsOverlap(px, py, pw, ph, finishObj.x, finishScreenY, finishObj.w, finishObj.h)) {
      handleLevelComplete();
      return;
    }
  }

  const px = player.baseX;
  const py = player.baseY + player.jumpOffset;
  const pw = player.width;
  const ph = player.height;
  const isAirborne = player.jumpOffset < -12;

  for (let obs of obstacles) {
    const sy = obs.y - cameraY;
    if (sy > canvas.height + 140 || sy < -180) continue;

    if (obs.type === "jumpBig") {
      if (rectsOverlap(px, py, pw, ph, obs.x, sy, obs.w, obs.h) && player.jumpOffset >= -2) {
        triggerRampJump(true);
      }
      continue;
    }

    if (obs.type === "jump") {
      if (rectsOverlap(px, py, pw, ph, obs.x, sy, obs.w, obs.h) && player.jumpOffset >= -2) {
        triggerRampJump(false);
      }
      continue;
    }

    if (obs.type === "flagLeft" || obs.type === "flagRight") {
      if (rectsOverlap(px, py, pw, ph, obs.x, sy, obs.w, obs.h)) {
        obs.hit = true;
        handleCrash();
        return;
      }
      continue;
    }

    // All other obstacles are crash hazards when on the ground
    if (!isAirborne && rectsOverlap(px, py, pw, ph, obs.x, sy, obs.w, obs.h)) {
      obs.hit = true;
      handleCrash();
      return;
    }
  }

  if (cameraY > trackLength + 400) {
    handleCrash();
  }

  framesSinceRunStart++;
}

// Obstacles
function drawObstacles() {
  obstacles.forEach((obs) => {
    const sy = obs.y - cameraY;
    if (sy > canvas.height + 140 || sy < -180) return;

    if (obs.type === "tree") {
      ctx.fillStyle = obs.hit ? "#ff0000" : "#1b5e20";
      ctx.beginPath();
      ctx.moveTo(obs.x + obs.w / 2, sy - 10);
      ctx.lineTo(obs.x, sy + obs.h);
      ctx.lineTo(obs.x + obs.w, sy + obs.h);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#4e342e";
      ctx.fillRect(obs.x + obs.w / 2 - 5, sy + obs.h, 10, 14);
    } else if (obs.type === "rock") {
      ctx.fillStyle = obs.hit ? "#ff0000" : "#424242";
      ctx.beginPath();
      ctx.ellipse(obs.x + obs.w / 2, sy + obs.h / 2, 24, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#9e9e3e";
      ctx.beginPath();
      ctx.ellipse(obs.x + obs.w / 2 - 8, sy + obs.h / 2 - 8, 8, 6, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (obs.type === "stump") {
      ctx.fillStyle = obs.hit ? "#ff0000" : "#6d4c41";
      ctx.fillRect(obs.x, sy + 20, obs.w, 36);
      ctx.fillStyle = "#3e2723";
      ctx.fillRect(obs.x + 6, sy + 10, obs.w - 12, 12);
    } else if (obs.type === "ice") {
      ctx.fillStyle = "rgba(144,202,249,0.9)";
      ctx.beginPath();
      ctx.ellipse(obs.x + obs.w / 2, sy + obs.h / 2, obs.w / 2, obs.h / 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(227,242,253,0.9)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(obs.x + obs.w / 2, sy + obs.h / 2, obs.w / 2 - 6, obs.h / 3 - 4, 0, 0, Math.PI * 2);
      ctx.stroke();
    } else if (obs.type === "fence") {
      ctx.strokeStyle = "#5d4037";
      ctx.lineWidth = 4;
      const posts = 3;
      const spacing = obs.w / (posts - 1);
      for (let p = 0; p < posts; p++) {
        const px = obs.x + p * spacing;
        ctx.beginPath();
        ctx.moveTo(px, sy + obs.h);
        ctx.lineTo(px, sy + obs.h - 40);
        ctx.stroke();
      }
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(obs.x, sy + obs.h - 32);
      ctx.lineTo(obs.x + obs.w, sy + obs.h - 32);
      ctx.moveTo(obs.x, sy + obs.h - 22);
      ctx.lineTo(obs.x + obs.w, sy + obs.h - 22);
      ctx.stroke();
    } else if (obs.type === "snowman") {
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(obs.x + obs.w / 2, sy + obs.h - 40, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(obs.x + obs.w / 2, sy + obs.h - 64, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#000000";
      ctx.beginPath();
      ctx.arc(obs.x + obs.w / 2 - 4, sy + obs.h - 68, 2, 0, Math.PI * 2);
      ctx.arc(obs.x + obs.w / 2 + 4, sy + obs.h - 68, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ff6d00";
      ctx.beginPath();
      ctx.moveTo(obs.x + obs.w / 2, sy + obs.h - 62);
      ctx.lineTo(obs.x + obs.w / 2 + 8, sy + obs.h - 60);
      ctx.lineTo(obs.x + obs.w / 2, sy + obs.h - 58);
      ctx.closePath();
      ctx.fill();
    } else if (obs.type === "flagLeft" || obs.type === "flagRight") {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(obs.x, sy, 4, obs.h);
      ctx.fillStyle = obs.type === "flagLeft" ? "#ff1744" : "#00e5ff";
      ctx.beginPath();
      ctx.moveTo(obs.x + 4, sy);
      ctx.lineTo(obs.x + 4 + 18, sy + 10);
      ctx.lineTo(obs.x + 4, sy + 20);
      ctx.closePath();
      ctx.fill();
    } else if (obs.type === "jump") {
      ctx.fillStyle = "#ffea00";
      ctx.beginPath();
      ctx.moveTo(obs.x, sy + obs.h);
      ctx.lineTo(obs.x + obs.w, sy + obs.h);
      ctx.lineTo(obs.x + obs.w, sy);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#f57f17";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(obs.x + 10, sy + obs.h - 6);
      ctx.lineTo(obs.x + obs.w - 10, sy + obs.h - 12);
      ctx.stroke();
    } else if (obs.type === "jumpBig") {
      ctx.fillStyle = "#ffc400";
      ctx.beginPath();
      ctx.moveTo(obs.x, sy + obs.h);
      ctx.lineTo(obs.x + obs.w, sy + obs.h);
      ctx.lineTo(obs.x + obs.w, sy - 10);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#ff6f00";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(obs.x + 12, sy + obs.h - 4);
      ctx.lineTo(obs.x + obs.w - 12, sy + obs.h - 16);
      ctx.stroke();
    }
  });

  if (finishObj) {
    const sy = finishObj.y - cameraY;
    if (sy > -40 && sy < canvas.height + 60) {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(finishObj.x, sy, finishObj.w, finishObj.h);
      for (let i = 0; i < finishObj.w; i += 32) {
        ctx.fillStyle = (Math.floor(i / 32) % 2 === 0) ? "#000000" : "#ff0000";
        ctx.fillRect(finishObj.x + i, sy, 16, finishObj.h);
      }
    }
  }
}

// Player (reused for both game & preview) - more like 🏂
function drawPlayer(customX, customY, scale = 1) {
  const colors = getCurrentColors();

  const useCustomPos = typeof customX === "number" && typeof customY === "number";
  const px = useCustomPos ? customX : player.baseX;
  const py = useCustomPos ? customY : player.baseY + player.jumpOffset;

  let pushOffsetY = 0;
  let pushSwayX = 0;
  if (!useCustomPos && state === "playing" && framesSinceRunStart > 0 && framesSinceRunStart < 25) {
    pushOffsetY = Math.sin((framesSinceRunStart / 25) * Math.PI) * 4;
    pushSwayX = Math.sin(framesSinceRunStart / 3) * 2;
  }

  const drawX = px + pushSwayX;
  const drawY = py + pushOffsetY;

  const centerX = drawX + (player.width * scale) / 2;
  const centerY = drawY + (player.height * scale) / 2;

  ctx.save();
  ctx.translate(centerX, centerY);
  if (!useCustomPos && player.isFlipping) {
    ctx.rotate(player.flipAngle);
  }

  const w = player.width * scale;
  const h = player.height * scale;
  const lx = -w / 2;
  const ly = -h / 2;

  // Base tilt like emoji 🏂 (board sideways, carving)
  let tilt = 0;
  if (!useCustomPos && !player.isFlipping) {
    if (keys["ArrowLeft"] || keys["KeyA"]) tilt = 1.1;
    else if (keys["ArrowRight"] || keys["KeyD"]) tilt = -1.1;
    // Lean the whole rider with the board (body lean)
    ctx.rotate(tilt * 0.6);
  }

  // Board
  ctx.save();
  ctx.translate(0, h / 2 + 2 * scale);
  ctx.rotate(tilt - 0.2);
  let dir = 0;
  if (!useCustomPos) {
    if (keys["ArrowLeft"] || keys["KeyA"]) dir = -1;
    else if (keys["ArrowRight"] || keys["KeyD"]) dir = 1;
  }
  if (dir !== 0) ctx.scale(dir, 1);
  ctx.fillStyle = "#111";
  const boardLength = w + 30 * scale;
  const boardThickness = 7 * scale;
  if (ctx.roundRect) {
    ctx.roundRect(-boardLength / 2, -boardThickness / 2, boardLength, boardThickness, 4 * scale);
    ctx.fill();
  } else {
    ctx.fillRect(-boardLength / 2, -boardThickness / 2, boardLength, boardThickness);
  }
  ctx.fillStyle = colors.board;
  if (ctx.roundRect) {
    ctx.roundRect(
      -boardLength / 2 + 1 * scale,
      -boardThickness / 2 + 1 * scale,
      boardLength - 2 * scale,
      boardThickness - 3 * scale,
      3 * scale
    );
    ctx.fill();
  } else {
    ctx.fillRect(
      -boardLength / 2 + 1 * scale,
      -boardThickness / 2 + 1 * scale,
      boardLength - 2 * scale,
      boardThickness - 3 * scale
    );
  }
  ctx.restore();

  // Legs & boots
  ctx.fillStyle = colors.pants;
  ctx.fillRect(lx + 2 * scale, ly + 22 * scale, (w / 2) - 3 * scale, h - 30 * scale);
  ctx.fillRect(lx + (w / 2) + 1 * scale, ly + 24 * scale, (w / 2) - 4 * scale, h - 30 * scale);

  ctx.fillStyle = colors.boots;
  const stanceShift = tilt * 6 * scale;
  ctx.fillRect(lx + 2 * scale - stanceShift, ly + h - 11 * scale, (w / 2) - 1 * scale, 7 * scale);
  ctx.fillRect(lx + (w / 2) + stanceShift, ly + h - 11 * scale, (w / 2) - 2 * scale, 7 * scale);

  // Torso
  const bodyGrad = ctx.createLinearGradient(lx, ly, lx, ly + h);
  bodyGrad.addColorStop(0, colors.jacketTop);
  bodyGrad.addColorStop(1, colors.jacketBottom);
  ctx.fillStyle = bodyGrad;
  ctx.fillRect(lx + 4 * scale, ly + 8 * scale, w - 8 * scale, h - 26 * scale);

  // Zipper
  ctx.strokeStyle = "rgba(255,255,255,0.8)";
  ctx.lineWidth = 1.6 * scale;
  ctx.beginPath();
  ctx.moveTo(lx + w / 2, ly + 10 * scale);
  ctx.lineTo(lx + w / 2, ly + h - 18 * scale);
  ctx.stroke();

  // Arms
  ctx.strokeStyle = colors.jacketBottom;
  ctx.lineWidth = 5 * scale;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(lx + w / 2 + 2 * scale, ly + 14 * scale);
  ctx.lineTo(lx + w + 10 * scale, ly + 24 * scale);
  ctx.moveTo(lx + w / 2 - 2 * scale, ly + 14 * scale);
  ctx.lineTo(lx - 10 * scale, ly);
  ctx.stroke();

  // Hands
  ctx.fillStyle = colors.accent;
  ctx.beginPath();
  ctx.arc(lx + w + 10 * scale, ly + 24 * scale, 3.8 * scale, 0, Math.PI * 2);
  ctx.arc(lx - 10 * scale, ly, 4 * scale, 0, Math.PI * 2);
  ctx.fill();

  // Head & helmet/goggles
  ctx.beginPath();
  ctx.arc(lx + w / 2, ly + 6 * scale, 9 * scale, 0, Math.PI * 2);
  ctx.fillStyle = "#f8e1c4";
  ctx.fill();

  ctx.fillStyle = colors.helmet;
  ctx.beginPath();
  ctx.arc(lx + w / 2, ly + 3 * scale, 10 * scale, Math.PI, 0);
  ctx.fill();

  ctx.fillStyle = "#263238";
  ctx.fillRect(lx + w / 2 - 11 * scale, ly + 1 * scale, 22 * scale, 7 * scale);
  const gGrad = ctx.createLinearGradient(
    lx + w / 2 - 11 * scale,
    ly + 1 * scale,
    lx + w / 2 + 11 * scale,
    ly + 1 * scale
  );
  gGrad.addColorStop(0, "#00e5ff");
  gGrad.addColorStop(1, "#81d4fa");
  ctx.fillStyle = gGrad;
  ctx.fillRect(lx + w / 2 - 9 * scale, ly + 2 * scale, 18 * scale, 5 * scale);
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 1 * scale;
  ctx.strokeRect(lx + w / 2 - 9 * scale, ly + 2 * scale, 18 * scale, 5 * scale);

  ctx.restore();
}

// Trick popups
function drawTrickPopups() {
  for (let i = trickPopups.length - 1; i >= 0; i--) {
    const p = trickPopups[i];
    const alpha = Math.min(1, p.life / 20);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#ffeb3b";
    ctx.font = "26px Arial";
    ctx.textAlign = "center";
    const x = player.baseX + player.width / 2;
    const y = player.baseY + player.jumpOffset - 40 + p.offsetY;
    ctx.fillText(p.text, x, y);
    ctx.restore();
    p.life--;
    if (p.life <= 0) {
      trickPopups.splice(i, 1);
    }
  }
  ctx.textAlign = "left";
}

// Mini-map
function drawMiniMap() {
  if (!trackLength || trackLength <= 0) return;

  const mapW = 90;
  const mapH = 160;
  const margin = 16;
  const x = canvas.width - mapW - margin;
  const y = 80;

  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(x - 4, y - 4, mapW + 8, mapH + 8);
  ctx.globalAlpha = 1.0;

  ctx.fillStyle = "#e0f7ff";
  ctx.fillRect(x, y, mapW, mapH);

  ctx.fillStyle = "#b0bec5";
  const trackX = x + mapW * 0.2;
  const trackW = mapW * 0.6;
  ctx.fillRect(trackX, y, trackW, mapH);

  if (finishObj) {
    const finishPos = Math.min(1, Math.max(0, finishObj.y / trackLength));
    const fy = y + mapH * finishPos;
    ctx.strokeStyle = "#ff1744";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(trackX, fy);
    ctx.lineTo(trackX + trackW, fy);
    ctx.stroke();
  }

  const progress = Math.min(1, Math.max(0, cameraY / trackLength));
  const py = y + mapH * progress;
  ctx.fillStyle = "#00c853";
  ctx.beginPath();
  ctx.arc(x + mapW / 2, py, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = "10px Arial";
  ctx.fillStyle = "#000000";
  ctx.textAlign = "center";
  ctx.fillText("Mini Map", x + mapW / 2, y - 6);

  ctx.restore();
}

// HUD
function drawHUD() {
  ctx.fillStyle = "#ffffff";
  ctx.font = "22px Arial";
  ctx.textAlign = "left";
  ctx.fillText("Score: " + score, 24, 34);
  ctx.fillText("Lives: " + lives, 24, 64);
  ctx.textAlign = "right";
  ctx.fillText("Level: " + level + " / " + MAX_LEVEL, canvas.width - 24, 34);

  drawMiniMap();

  if (state === "countdown") {
    const secondsLeft = countdownFrames / 60;
    let label = "";
    if (secondsLeft > 2) label = "3";
    else if (secondsLeft > 1) label = "2";
    else if (secondsLeft > 0) label = "1";
    else label = "GO!";

    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, canvas.height / 2 - 140, canvas.width, 280);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffffff";
    ctx.font = "40px Arial";
    ctx.fillText("MOUNTAIN RUN", canvas.width / 2, canvas.height / 2 - 60);
    ctx.font = "30px Arial";
    ctx.fillText("Level " + level + " of " + MAX_LEVEL, canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = "72px Arial";
    ctx.fillStyle = "#ffeb3b";
    ctx.fillText(label, canvas.width / 2, canvas.height / 2 + 60);
    ctx.textAlign = "left";
  }

  if (state === "gameOver") {
    const flashOn = Math.floor(globalFrame / 15) % 2 === 0;
    if (flashOn) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#ff1744";
      ctx.font = "bold 52px Arial";
      ctx.fillText("YOU CRASHED!", canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillText("GAME OVER!", canvas.width / 2, canvas.height / 2 + 30);
      ctx.textAlign = "left";
    }
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffffff";
    ctx.font = "24px Arial";
    ctx.fillText("Press R or tap Restart", canvas.width / 2, canvas.height / 2 + 90);
    ctx.textAlign = "left";
  }

  if (state === "champion") {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = "#ffd700";
    ctx.beginPath();
    ctx.moveTo(-80, -40);
    ctx.lineTo(-60, -120);
    ctx.lineTo(60, -120);
    ctx.lineTo(80, -40);
    ctx.quadraticCurveTo(0, 40, -80, -40);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-60, -110);
    ctx.quadraticCurveTo(-120, -100, -110, -40);
    ctx.quadraticCurveTo(-90, -60, -80, -40);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(60, -110);
    ctx.quadraticCurveTo(120, -100, 110, -40);
    ctx.quadraticCurveTo(90, -60, 80, -40);
    ctx.fill();
    ctx.fillRect(-20, 40, 40, 35);
    ctx.fillRect(-70, 75, 140, 22);
    ctx.restore();

    ctx.textAlign = "center";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 60px Arial";
    ctx.fillText("CHAMPION!", cx, cy + 150);
    ctx.font = "26px Arial";
    ctx.fillText("Gold Medal Unlocked - Level 10 Complete!", cx, cy + 190);
    ctx.fillText("Press R or tap Restart", cx, cy + 230);
    ctx.textAlign = "left";
  }
}

// --- Menu UI ---
function getMenuRects() {
  const rects = {
    jacket: [],
    pants: [],
    gloves: [],
    board: [],
    start: null
  };

  const sectionWidth = 520;
  const xStart = (canvas.width - sectionWidth) / 2;
  let y = 260;
  const boxSize = 40;
  const boxGap = 16;

  // Jacket row
  for (let i = 0; i < jacketOptions.length; i++) {
    const x = xStart + i * (boxSize + boxGap);
    rects.jacket.push({ x, y: y + 10, w: boxSize, h: boxSize });
  }
  y += 90;

  // Pants row
  for (let i = 0; i < pantsOptions.length; i++) {
    const x = xStart + i * (boxSize + boxGap);
    rects.pants.push({ x, y: y + 10, w: boxSize, h: boxSize });
  }
  y += 90;

  // Gloves row
  for (let i = 0; i < gloveOptions.length; i++) {
    const x = xStart + i * (boxSize + boxGap);
    rects.gloves.push({ x, y: y + 10, w: boxSize, h: boxSize });
  }
  y += 90;

  // Board row
  for (let i = 0; i < boardOptions.length; i++) {
    const x = xStart + i * (boxSize + boxGap);
    rects.board.push({ x, y: y + 10, w: boxSize, h: boxSize });
  }

  // Start button
  rects.start = {
    x: canvas.width / 2 - 110,
    y: y + 90,
    w: 220,
    h: 48
  };

  return rects;
}

function handleMenuClick(x, y) {
  const rects = getMenuRects();

  function inside(r) {
    return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  }

  rects.jacket.forEach((r, i) => {
    if (inside(r)) currentSelection.jacketIndex = i;
  });
  rects.pants.forEach((r, i) => {
    if (inside(r)) currentSelection.pantsIndex = i;
  });
  rects.gloves.forEach((r, i) => {
    if (inside(r)) currentSelection.gloveIndex = i;
  });
  rects.board.forEach((r, i) => {
    if (inside(r)) currentSelection.boardIndex = i;
  });

  if (inside(rects.start)) {
    startFromMenuIfReady();
  }
}

function drawMenu() {
  ctx.fillStyle = "rgba(0,0,0,0.65)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.textAlign = "center";
  ctx.fillStyle = "#ffffff";
  ctx.font = "42px Arial";
  ctx.fillText("ARCADE SNOWBOARD RUN", canvas.width / 2, 120);
  ctx.font = "26px Arial";
  ctx.fillText("Customize your rider", canvas.width / 2, 160);
  ctx.font = "20px Arial";
  ctx.fillText("Choose colors, then click START RUN", canvas.width / 2, 190);

  // Rider preview
  drawPlayer(canvas.width / 2 - 14, 190, 1.1);

  const rects = getMenuRects();
  ctx.textAlign = "left";
  ctx.font = "20px Arial";

  ctx.fillStyle = "#ffffff";
  ctx.fillText("Jacket Colors", rects.jacket[0].x, rects.jacket[0].y - 12);
  jacketOptions.forEach((opt, i) => {
    const r = rects.jacket[i];
    const grad = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
    grad.addColorStop(0, opt.top);
    grad.addColorStop(1, opt.bottom);
    ctx.fillStyle = grad;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    if (currentSelection.jacketIndex === i) {
      ctx.strokeStyle = "#ffeb3b";
      ctx.lineWidth = 3;
      ctx.strokeRect(r.x - 2, r.y - 2, r.w + 4, r.h + 4);
    }
  });

  ctx.fillStyle = "#ffffff";
  ctx.fillText("Pants Colors", rects.pants[0].x, rects.pants[0].y - 12);
  pantsOptions.forEach((opt, i) => {
    const r = rects.pants[i];
    ctx.fillStyle = opt.color;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    if (currentSelection.pantsIndex === i) {
      ctx.strokeStyle = "#ffeb3b";
      ctx.lineWidth = 3;
      ctx.strokeRect(r.x - 2, r.y - 2, r.w + 4, r.h + 4);
    }
  });

  ctx.fillStyle = "#ffffff";
  ctx.fillText("Glove Colors", rects.gloves[0].x, rects.gloves[0].y - 12);
  gloveOptions.forEach((opt, i) => {
    const r = rects.gloves[i];
    ctx.fillStyle = opt.color;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    if (currentSelection.gloveIndex === i) {
      ctx.strokeStyle = "#ffeb3b";
      ctx.lineWidth = 3;
      ctx.strokeRect(r.x - 2, r.y - 2, r.w + 4, r.h + 4);
    }
  });

  ctx.fillStyle = "#ffffff";
  ctx.fillText("Board Colors", rects.board[0].x, rects.board[0].y - 12);
  boardOptions.forEach((opt, i) => {
    const r = rects.board[i];
    ctx.fillStyle = opt.color;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    if (currentSelection.boardIndex === i) {
      ctx.strokeStyle = "#ffeb3b";
      ctx.lineWidth = 3;
      ctx.strokeRect(r.x - 2, r.y - 2, r.w + 4, r.h + 4);
    }
  });

  const sb = rects.start;
  ctx.fillStyle = "#00c853";
  ctx.fillRect(sb.x, sb.y, sb.w, sb.h);
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  ctx.strokeRect(sb.x, sb.y, sb.w, sb.h);
  ctx.fillStyle = "#ffffff";
  ctx.font = "24px Arial";
  ctx.textAlign = "center";
  ctx.fillText("START RUN", sb.x + sb.w / 2, sb.y + sb.h / 2 + 8);

  ctx.textAlign = "center";
  ctx.font = "16px Arial";
  ctx.fillStyle = "#ffffff";
  ctx.fillText("Tip: You can also press Enter to start", canvas.width / 2, sb.y + sb.h + 30);
  ctx.textAlign = "left";
}

// Main loop
function gameLoop() {
  globalFrame++;

  drawBackground();
  drawSnowAndSpeedLines();

  if (state === "menu") {
    drawMenu();
    requestAnimationFrame(gameLoop);
    return;
  }

  if (state === "playing") {
    updateGame();
  } else if (state === "countdown") {
    countdownFrames--;
    if (countdownFrames <= 0) {
      state = "playing";
      framesSinceRunStart = 0;
    }
  } else if (state === "celebrate") {
    celebrateFrames--;
    player.isFlipping = true;
    player.flipAngle += player.flipSpeed || (Math.PI * 2) / 20;
    if (celebrateFrames <= 0) {
      player.isFlipping = false;
      player.flipAngle = 0;
      player.flipSpeed = 0;
      if (level >= MAX_LEVEL) {
        state = "champion";
      } else {
        level++;
        countdownFrames = 180;
        startLevel();
        state = "countdown";
      }
    }
  }

  drawObstacles();
  drawPlayer();
  drawTrickPopups();
  drawHUD();

  requestAnimationFrame(gameLoop);
}

gameLoop();
