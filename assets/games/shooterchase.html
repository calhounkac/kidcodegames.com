<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Starfighter Chase: X‑Wing Escape</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(#030712, #02010a);
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(15,23,42,.85);
      border: 1px solid rgba(148,163,184,.5);
      box-shadow: 0 12px 30px rgba(0,0,0,.7);
      font-size: 13px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 10;
    }
    #hud span.label {
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: 10px;
      margin-right: 2px;
    }
    #hud span.value {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    #hud span.shields {
      color: #38bdf8;
    }
    #hud span.hits {
      color: #f97316;
    }
    #hud span.score {
      color: #a5b4fc;
    }
    #backBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      padding: 6px 12px;
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,.6);
      background: rgba(15,23,42,.9);
      color: #e5e7eb;
      text-transform: uppercase;
      letter-spacing: .18em;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,.7);
    }
    #backBtn:hover {
      background: rgba(15,23,42,1);
      box-shadow: 0 0 18px rgba(56,189,248,.7);
      border-color: rgba(56,189,248,.6);
    }
    canvas {
      display: block;
      margin: 40px auto 0 auto;
      background: #020617;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 40px rgba(56,189,248,.4);
    }

    /* On phones, make the game screen fill most of the width */
    @media (max-width: 900px) {
      canvas {
        width: 100vw;
        height: auto;
        margin-top: 10px;
      }
    }

    #retryBtn {
      position: absolute;
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%);
      padding: 10px 26px;
      font-size: 14px;
      border-radius: 999px;
      border: 1px solid rgba(248,250,252,0.85);
      background: rgba(15,23,42,0.95);
      color: #e5e7eb;
      text-transform: uppercase;
      letter-spacing: .16em;
      cursor: pointer;
      box-shadow: 0 16px 40px rgba(0,0,0,.8);
      display: none;
      z-index: 20;
    }
    #retryBtn:hover {
      background: rgba(30,64,175,1);
      box-shadow: 0 0 22px rgba(59,130,246,0.9);
    }


    .shield-seg {
      flex:1;
      height:6px;
      border-radius:999px;
      background:linear-gradient(90deg,#22c55e,#38bdf8);
      box-shadow:0 0 8px rgba(56,189,248,.7);
      opacity:1;
      transition:opacity .15s ease, background .2s ease, box-shadow .2s ease;
    }
    .shield-seg.off {
      opacity:0.12;
      box-shadow:none;
    }
    .shield-seg.danger {
      background:linear-gradient(90deg,#f97316,#ef4444);
      box-shadow:0 0 8px rgba(248,113,113,.8);
    }
    #shieldPopup.show {
      opacity:1;
      transform:translateY(0);
    }


.level-badge {
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  transition: background .2s ease, color .2s ease, box-shadow .2s ease;
}
.level-low {
  background: rgba(37,99,235,0.12);
  color: #38bdf8;
  box-shadow: 0 0 10px rgba(56,189,248,0.6);
}
.level-mid {
  background: rgba(234,179,8,0.16);
  color: #fbbf24;
  box-shadow: 0 0 10px rgba(250,204,21,0.7);
}
.level-high {
  background: rgba(248,113,113,0.16);
  color: #fb7185;
  box-shadow: 0 0 12px rgba(248,113,113,0.9);
}

#leaderboard {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 4px 8px;
  border-radius: 8px;
  background: rgba(15,23,42,0.92);
  border: 1px solid rgba(148,163,184,0.55);
  min-width: 150px;
  max-width: 200px;
}
#leaderboard .lb-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .16em;
  color: #9ca3af;
  margin-bottom: 2px;
}
#leaderboard ol {
  margin: 0;
  padding-left: 16px;
  font-size: 11px;
  color: #e5e7eb;
}
#leaderboard li span.lb-score {
  color: #a5b4fc;
  font-variant-numeric: tabular-nums;
  margin-left: 4px;
}


  </style>
</head>
<body>
  <div id="hud">
    <div>
      <span class="label">Shields</span>
      <span class="value shields" id="hp">10</span>
    </div>
    <div>
      <span class="label">Hits</span>
      <span class="value hits" id="hitsTaken">0 / 10</span>
    </div>
    <div>
      <span class="label">Score</span>
      <span class="value score" id="score">0</span>
    </div>
    <div>
      <span class="label">Level</span>
      <span class="value score level-badge level-low" id="levelDisplay">1</span>
    </div>
    <div>
      <span class="label">Ships</span>
      <span class="value score" id="shipsDisplay">0</span>
    </div>
    <div style="display:flex; flex-direction:column; gap:2px; min-width:160px;">
      <span class="label">Shields Bar</span>
      <div id="shieldBar" style="position:relative;width:160px;height:12px;border-radius:999px;overflow:hidden;background:#020617;border:1px solid rgba(148,163,184,.8);display:flex;align-items:center;justify-content:space-between;padding:0 2px;gap:2px;">
        <!-- Segments will be created by JS -->
      </div>
    </div>
    <div id="shieldPopup" style="margin-left:10px;font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:#4ade80;opacity:0;transform:translateY(6px);transition:opacity .25s ease, transform .25s ease;">
      +1 Shield
    </div>
    <div id="leaderboard">
      <div class="lb-title">Top Pilots</div>
      <ol id="leaderboardList"></ol>
      <button id="clearBoardBtn" type="button">Clear</button>
    </div>
  </div>
  <button id="backBtn">Back to KidCodeGames.com</button>
  <button id="retryBtn">Retry Mission</button>
  <canvas id="game" width="900" height="600"></canvas>


<div id="mobileControls">
  <div id="joystickBase">
    <div id="joystickKnob"></div>
  </div>
</div>
<style>
  #mobileControls {
    position: fixed;
    bottom: 24px;
    left: 24px;
    z-index: 30;
  }
  #joystickBase {
    position: relative;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(148,163,184,0.35), rgba(15,23,42,0.95));
    border: 2px solid rgba(148,163,184,0.7);
    box-shadow: 0 14px 32px rgba(0,0,0,0.85);
    touch-action: none;
  }
  #joystickKnob {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #38bdf8, #1d4ed8);
    box-shadow: 0 8px 20px rgba(8,47,73,0.9);
    touch-action: none;
  }

  /* Desktop: smaller joystick */
  #joystickBase {
    width: 120px;
    height: 120px;
  }
  #joystickKnob {
    width: 60px;
    height: 60px;
  }

  /* Phones: larger joystick for thumbs */
  @media (max-width: 900px) {
    #joystickBase {
      width: 170px;
      height: 170px;
    }
    #joystickKnob {
      width: 90px;
      height: 90px;
    }
    #mobileControls {
      bottom: 30px;
      left: 30px;
    }
  }
</style>




  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const hpDisplay = document.getElementById('hp');
    const scoreDisplay = document.getElementById('score');
    const hitsDisplay = document.getElementById('hitsTaken');
    const shipsDisplay = document.getElementById('shipsDisplay');
    const retryBtn = document.getElementById('retryBtn');
    const leaderboardList = document.getElementById('leaderboardList');
    const clearBoardBtn = document.getElementById('clearBoardBtn');

    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'https://kidcodegames.com';
    });

    if (retryBtn) {
      retryBtn.addEventListener('click', () => {
        restartGame();
        retryBtn.style.display = 'none';
      });
    }

    if (clearBoardBtn) {
      clearBoardBtn.addEventListener('click', () => {
        leaderboard = [];
        saveLeaderboard();
        renderLeaderboard();
      });
    }

    // --- Game state ---

    const MAX_HITS = 10;
    const MAX_LEVEL = 10;
    let running = true;
    let score = 0;
    let hitsTaken = 0;
    let enemiesDestroyed = 0; // count kills for extra shields & level-ups
    let level = 1;
    let levelUpTimer = 0; // seconds for center-screen LEVEL UP flash

    // Simple local leaderboard (stored in this browser)
    let leaderboard = [];

    function loadLeaderboard() {
      try {
        const raw = localStorage.getItem('starfighter_leaderboard');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) leaderboard = parsed;
        }
      } catch {}
      renderLeaderboard();
    }

    function saveLeaderboard() {
      try {
        localStorage.setItem('starfighter_leaderboard', JSON.stringify(leaderboard));
      } catch {}
    }

    function renderLeaderboard() {
      if (!leaderboardList) return;
      leaderboardList.innerHTML = '';
      leaderboard
        .slice(0, 3)
        .forEach((entry, idx) => {
          const li = document.createElement('li');

          const name = document.createElement('span');
          name.textContent = entry.name;

          const scoreSpan = document.createElement('span');
          scoreSpan.className = 'lb-score';
          scoreSpan.textContent = entry.score;

          const metaSpan = document.createElement('span');
          metaSpan.className = 'lb-meta';
          const lvl = entry.level != null ? entry.level : 1;
          const ships = entry.ships != null ? entry.ships : 0;
          metaSpan.textContent = `  L${lvl}, ${ships} ships`;

          li.appendChild(name);
          li.appendChild(scoreSpan);
          li.appendChild(metaSpan);
          leaderboardList.appendChild(li);
        });
    }

    function tryAddLeaderboardEntry(finalScore, finalLevel, finalShips) {
      if (finalScore <= 0) return;
      // Determine if this score qualifies for top 5
      const sorted = leaderboard.slice().sort((a,b) => b.score - a.score);
      const lowestTop = sorted.length < 5 ? 0 : sorted[sorted.length - 1].score;
      if (sorted.length >= 5 && finalScore <= lowestTop) {
        return; // not high enough for table
      }

      let name = prompt('New Top Score! Enter your initials:', 'ACE');
      if (!name) return;
      name = name.toUpperCase().slice(0, 8);

      leaderboard.push({
        name,
        score: finalScore,
        level: finalLevel,
        ships: finalShips
      });
      leaderboard.sort((a,b) => b.score - a.score);
      leaderboard = leaderboard.slice(0, 3);
      saveLeaderboard();
      renderLeaderboard();
    }

    // Player eject animation
    const playerEject = {
      active: false,
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      age: 0
    };

    const levelDisplay = document.getElementById('levelDisplay');
    const shieldBar = document.getElementById('shieldBar');
    const shieldPopup = document.getElementById('shieldPopup');
    const shieldSegments = [];

    // Build 10 discrete shield segments
    if (shieldBar) {
      for (let i = 0; i < MAX_HITS; i++) {
        const seg = document.createElement('div');
        seg.className = 'shield-seg';
        shieldBar.appendChild(seg);
        shieldSegments.push(seg);
      }
    }

    function showShieldPopup() {
      if (!shieldPopup) return;
      shieldPopup.classList.add('show');
      setTimeout(() => {
        shieldPopup.classList.remove('show');
      }, 600);
    }

    function updateShieldBar() {
      const shieldsLeft = Math.max(0, MAX_HITS - hitsTaken);
      const danger = shieldsLeft <= 3;
      for (let i = 0; i < shieldSegments.length; i++) {
        const seg = shieldSegments[i];
        if (!seg) continue;
        const on = i < shieldsLeft;
        seg.classList.toggle('off', !on);
        seg.classList.toggle('danger', danger && on);
      }
    }

    function checkLevelUp() {
      const newLevel = Math.min(MAX_LEVEL, 1 + Math.floor(enemiesDestroyed / 20));
      if (newLevel > level) {
        level = newLevel;
        if (levelDisplay) {
          levelDisplay.textContent = level;
          levelDisplay.classList.remove('level-low','level-mid','level-high');
          if (level <= 3) levelDisplay.classList.add('level-low');
          else if (level <= 7) levelDisplay.classList.add('level-mid');
          else levelDisplay.classList.add('level-high');
        }
        // Trigger LEVEL UP flash in center
        levelUpTimer = 0.8;

        // Small "level up" chime
        playTone(1040, 0.09, 0.16, 'square');
        playTone(1560, 0.11, 0.12, 'triangle');
      }
    }

// Player X‑Wing
    const player = {
      x: canvas.width * 0.5,
      y: canvas.height * 0.6,
      r: 16,
      speed: 260,
      angle: -Math.PI / 2 // facing up
    };

    const keys = {};
    document.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      keys[k] = true;

      // Spacebar fires lasers in the current facing direction
      if (running && (e.code === 'Space' || k === ' ')) {
        firePlayerLasers(player.angle);
      }

      if (!running && k === 'r') {
        restartGame();
      }
    });
    document.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // Track mouse to aim the X‑Wing
    const mouse = { x: player.x, y: player.y - 100 };
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });

    // Shooting
    const bullets = [];      // player lasers
    const enemyBullets = []; // enemy lasers
    const enemies = [];
    const ejectees = [];
    const explosions = [];

    let lastEnemySpawn = 0;
    const enemySpawnInterval = 1100; // base ms (unused directly, kept for reference)

    // Precomputed starfield & planets
    const stars = [];
    const starCount = 180;
    for (let i = 0; i < starCount; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.4 + 0.4,
        tw: Math.random() * Math.PI * 2
      });
    }

    const planets = [
      {
        x: canvas.width * 0.18,
        y: canvas.height * 0.25,
        r: 60,
        base: '#1f2937',
        glow: '#22c55e'
      },
      {
        x: canvas.width * 0.78,
        y: canvas.height * 0.18,
        r: 42,
        base: '#020617',
        glow: '#f97316'
      },
      {
        x: canvas.width * 0.6,
        y: canvas.height * 0.7,
        r: 26,
        base: '#020617',
        glow: '#38bdf8'
      }
    ];

    // Simple sound beeps (no external files)
    let audioCtx = null;
    function playTone(freq = 800, dur = 0.07, vol = 0.1, type = 'square') {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!audioCtx) audioCtx = new AC();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = vol;
        osc.connect(gain).connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    // Mouse click fires a pair of X‑Wing laser bolts
    canvas.addEventListener('click', (e) => {
      if (!running) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const angle = Math.atan2(my - player.y, mx - player.x);
      firePlayerLasers(angle);
    });
    // Touch to shoot (mobile)
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!running) return;
      const rect = canvas.getBoundingClientRect();
      const t = e.changedTouches[0];
      const mx = t.clientX - rect.left;
      const my = t.clientY - rect.top;
      const angle = Math.atan2(my - player.y, mx - player.x);
      firePlayerLasers(angle);
    }, { passive: false });


    function firePlayerLasers(angle) {
      const speed = 520;
      const spread = 10; // left/right of fuselage
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;

      const sideOffset = 8;
      const ox = Math.cos(angle + Math.PI / 2) * sideOffset;
      const oy = Math.sin(angle + Math.PI / 2) * sideOffset;

      bullets.push({
        x: player.x + ox,
        y: player.y + oy,
        dx: vx,
        dy: vy,
        r: 3,
        life: 2
      });
      bullets.push({
        x: player.x - ox,
        y: player.y - oy,
        dx: vx,
        dy: vy,
        r: 3,
        life: 2
      });
      playTone(1020, 0.06, 0.11, 'square');
    }

    function fireEnemyLaser(e) {
      const angle = Math.atan2(player.y - e.y, player.x - e.x);
      const speed = 360;
      enemyBullets.push({
        x: e.x,
        y: e.y,
        dx: Math.cos(angle) * speed,
        dy: Math.sin(angle) * speed,
        r: 3,
        life: 3
      });
      playTone(360, 0.06, 0.08, 'sawtooth');
    }

    // Enemy factory: TIE‑style and stealth fighters
    function spawnEnemy(timeNow) {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      if (side === 0) { x = Math.random() * canvas.width; y = -30; }
      else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height + 30; }
      else if (side === 2) { x = -30; y = Math.random() * canvas.height; }
      else { x = canvas.width + 30; y = Math.random() * canvas.height; }

      const canEject = Math.random() < 0.75; // more ships eject pilots now
      const kind = Math.random() < 0.7 ? 'tie' : 'stealth'; // mostly TIEs, some stealth
      const tint = kind === 'stealth'
        ? 'red'
        : (Math.random() < 0.5 ? 'blue' : 'red'); // blue & red TIEs; stealth are usually red

      enemies.push({
        x,
        y,
        r: kind === 'stealth' ? 20 : 18,
        speed: ((kind === 'stealth' ? 90 : 70) + (level - 1) * 10) + Math.random() * 40,
        fireCooldown: 500 + Math.random() * 1200,
        state: 'normal', // 'normal' | 'burning'
        burnTime: 0,
        canEject,
        ejected: false,
        kind,
        tint
      });
      lastEnemySpawn = timeNow;
    }

    function addExplosion(x, y, big = true) {
      explosions.push({
        x,
        y,
        age: 0,
        life: big ? 0.7 : 0.4,
        big
      });
    }

    function addEjectee(x, y) {
      ejectees.push({
        x,
        y,
        vx: (Math.random() - 0.5) * 60,
        vy: 40 + Math.random() * 60,
        r: 8,
        alive: true
      });
    }

    function registerHit() {
      hitsTaken++;
      const shieldsLeft = Math.max(0, MAX_HITS - hitsTaken);
      hpDisplay.textContent = shieldsLeft;
      hitsDisplay.textContent = hitsTaken + " / " + MAX_HITS;
      playTone(220, 0.08, 0.15, 'triangle');
      updateShieldBar();

      if (hitsTaken >= MAX_HITS && running) {
        gameOver();
      }
    }

    function gameOver() {
      if (!running) return;
      running = false;

      // Trigger a player eject animation
      playerEject.active = true;
      playerEject.x = player.x;
      playerEject.y = player.y;
      playerEject.vx = -40 + Math.random() * 80; // slight horizontal drift
      playerEject.vy = -160; // shoot upward first
      playerEject.age = 0;

      // Try to record high score
      tryAddLeaderboardEntry(score, level, enemiesDestroyed);

      // Show retry button
      if (retryBtn) {
        retryBtn.style.display = 'inline-block';
      }
    }

    function restartGame() {
      // Reset state
      running = true;
      score = 0;
      hitsTaken = 0;
      enemiesDestroyed = 0;
      level = 1;
      if (shipsDisplay) shipsDisplay.textContent = '0';
      playerEject.active = false;
      if (retryBtn) retryBtn.style.display = 'none';
      if (levelDisplay) { levelDisplay.textContent = level; levelDisplay.classList.remove('level-low','level-mid','level-high'); levelDisplay.classList.add('level-low'); }
      hpDisplay.textContent = MAX_HITS;
      hitsDisplay.textContent = "0 / " + MAX_HITS;
      scoreDisplay.textContent = "0";
      if (levelDisplay) { levelDisplay.textContent = level; levelDisplay.classList.add('level-low'); }
      updateShieldBar();

      player.x = canvas.width * 0.5;
      player.y = canvas.height * 0.6;
      player.angle = -Math.PI / 2;

      bullets.length = 0;
      enemyBullets.length = 0;
      enemies.length = 0;
      ejectees.length = 0;
      explosions.length = 0;

      lastEnemySpawn = performance.now();
    }

    // --- Update ---
    function update(dt, timeNow) {
      // Decay level-up overlay timer even if game is over
      if (levelUpTimer > 0) {
        levelUpTimer = Math.max(0, levelUpTimer - dt);
      }

      // Animate player eject even after game over
      if (playerEject.active) {
        playerEject.age += dt;
        playerEject.vy += 180 * dt; // gravity pull
        playerEject.x += playerEject.vx * dt;
        playerEject.y += playerEject.vy * dt;
        if (playerEject.y > canvas.height + 40) {
          playerEject.active = false;
        }
      }

      if (!running) {
        // Let explosions finish animating even after game over
        for (const ex of explosions) {
          ex.age += dt;
        }
        return;
      }

      // Player movement (WASD)
      const moveAmount = player.speed * dt;
      if (keys['w'] || keys['arrowup']) player.y -= moveAmount;
      if (keys['s'] || keys['arrowdown']) player.y += moveAmount;
      if (keys['a'] || keys['arrowleft']) player.x -= moveAmount;
      if (keys['d'] || keys['arrowright']) player.x += moveAmount;

      // Clamp player to screen
      player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x));
      player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y));

      // Aim X‑Wing toward mouse
      player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

      // Spawn enemies (interval shrinks with level)
      const levelFactor = (level - 1);
      const interval = Math.max(450, 1300 - levelFactor * 90);
      if (timeNow - lastEnemySpawn > interval) {
        spawnEnemy(timeNow);
      }

      // Update player bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.dx * dt;
        b.y += b.dy * dt;
        b.life -= dt;
        if (b.life <= 0 ||
            b.x < -20 || b.x > canvas.width + 20 ||
            b.y < -20 || b.y > canvas.height + 20) {
          bullets.splice(i, 1);
        }
      }

      // Update enemy bullets
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.dx * dt;
        eb.y += eb.dy * dt;
        eb.life -= dt;
        if (eb.life <= 0 ||
            eb.x < -20 || eb.x > canvas.width + 20 ||
            eb.y < -20 || eb.y > canvas.height + 20) {
          enemyBullets.splice(i, 1);
        }
      }

      // Update enemies
      let enemyShotsThisTick = 0;
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];

        if (e.state === 'normal') {
          // Chase player
          const ang = Math.atan2(player.y - e.y, player.x - e.x);
          e.x += Math.cos(ang) * e.speed * dt;
          e.y += Math.sin(ang) * e.speed * dt;

          // Enemy fires occasionally (but throttle number of shots)
          e.fireCooldown -= dt * 1000;
          if (e.fireCooldown <= 0 && enemyShotsThisTick < 1 && enemyBullets.length < 20) {
            fireEnemyLaser(e);
            enemyShotsThisTick++;
            e.fireCooldown = 900 + Math.random() * 1400;
          }

          // Collision with player ship
          const dxp = e.x - player.x;
          const dyp = e.y - player.y;
          if (Math.hypot(dxp, dyp) < e.r + player.r) {
            registerHit();
            addExplosion(e.x, e.y, true);
            enemies.splice(i, 1);
            continue;
          }
        } else if (e.state === 'burning') {
          e.burnTime += dt;
          e.y += 30 * dt; // drifting while burning
          // After a moment, eject 1‑3 pilots (if any), then explode
          if (e.canEject && !e.ejected && e.burnTime > 0.2) {
            const ejectCount = 1 + Math.floor(Math.random() * 3); // 1–3 pilots
            for (let n = 0; n < ejectCount; n++) {
              const spreadX = (Math.random() - 0.5) * 24;
              addEjectee(e.x + spreadX, e.y - 4);
            }
            e.ejected = true;
          }
          if (e.burnTime > 0.6) {
            addExplosion(e.x, e.y, true);
            enemies.splice(i, 1);
            continue;
          }
        }

        // Remove if offscreen for too long
        if (e.x < -80 || e.x > canvas.width + 80 || e.y < -80 || e.y > canvas.height + 80) {
          enemies.splice(i, 1);
        }
      }

      // Player bullets vs enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.state !== 'normal') continue;
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const dx = e.x - b.x;
          const dy = e.y - b.y;
          if (Math.hypot(dx, dy) < e.r + b.r) {
            // Hit!
            bullets.splice(j, 1);
            score += 50;
            scoreDisplay.textContent = score;
            playTone(620, 0.08, 0.16, 'sawtooth');
            e.state = 'burning';
            playExplosion();
            e.burnTime = 0;

            enemiesDestroyed++;
            if (shipsDisplay) shipsDisplay.textContent = String(enemiesDestroyed);
            checkLevelUp();
            // Every 10 destroyed ships, grant +1 shield (if not already max)
            if (enemiesDestroyed % 10 === 0 && hitsTaken > 0 && hitsTaken < MAX_HITS) {
              hitsTaken--;
              const shieldsLeft2 = Math.max(0, MAX_HITS - hitsTaken);
              hpDisplay.textContent = shieldsLeft2;
              hitsDisplay.textContent = hitsTaken + " / " + MAX_HITS;
              updateShieldBar();
              showShieldPopup();
              playTone(980, 0.1, 0.18, 'sine');
            }
            break;
          }
        }
      }

      // Player bullets vs ejectees
      for (let i = ejectees.length - 1; i >= 0; i--) {
        const ev = ejectees[i];
        if (!ev.alive) continue;
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const dx = ev.x - b.x;
          const dy = ev.y - b.y;
          if (Math.hypot(dx, dy) < ev.r + b.r) {
            ev.alive = false;
            bullets.splice(j, 1);
            addExplosion(ev.x, ev.y, false);
            score += 30;
            scoreDisplay.textContent = score;
            playTone(880, 0.08, 0.16, 'triangle');
            break;
          }
        }
      }

      // Update ejectees
      for (let i = ejectees.length - 1; i >= 0; i--) {
        const ev = ejectees[i];
        if (!ev.alive) {
          ejectees.splice(i, 1);
          continue;
        }
        ev.x += ev.vx * dt;
        ev.y += ev.vy * dt;
        ev.vy += 40 * dt; // falling faster
        if (ev.y > canvas.height + 40) {
          ejectees.splice(i, 1);
        }
      }

      // Enemy bullets vs player
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        const dx = eb.x - player.x;
        const dy = eb.y - player.y;
        if (Math.hypot(dx, dy) < player.r + eb.r) {
          enemyBullets.splice(i, 1);
          registerHit();
        }
      }

      // Update explosions
      for (let i = explosions.length - 1; i >= 0; i--) {
        const ex = explosions[i];
        ex.age += dt;
        if (ex.age > ex.life) {
          explosions.splice(i, 1);
        }
      }
    }

    function drawBackground(timeNow) {
      const w = canvas.width;
      const h = canvas.height;

      // Deep space gradient
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#020617');
      g.addColorStop(0.45, '#020617');
      g.addColorStop(1, '#000000');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      // Stars (twinkling)
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.tw += 0.002;
        const twinkle = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(s.tw * 3 + i));
        ctx.globalAlpha = twinkle;
        ctx.fillStyle = '#e5e7eb';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Planets / distant worlds
      for (const p of planets) {
        const rad = p.r;
        const grad = ctx.createRadialGradient(
          p.x - rad * 0.4, p.y - rad * 0.4, rad * 0.2,
          p.x, p.y, rad * 1.2
        );
        grad.addColorStop(0, p.glow);
        grad.addColorStop(0.4, p.base);
        grad.addColorStop(1, '#020617');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
        ctx.fill();

        // Soft halo
        const halo = ctx.createRadialGradient(
          p.x, p.y, rad,
          p.x, p.y, rad * 2.1
        );
        halo.addColorStop(0, p.glow + '55');
        halo.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad * 2.1, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function playExplosion() {
      // Powerful explosion sound using noise + decay
      const ctxA = audioCtx;
      const dur = 0.35;
      const noise = ctxA.createBufferSource();
      const buffer = ctxA.createBuffer(1, ctxA.sampleRate * dur, ctxA.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-3 * i / data.length);
      }
      noise.buffer = buffer;

      const filter = ctxA.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 650;

      const gain = ctxA.createGain();
      gain.gain.setValueAtTime(1, ctxA.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctxA.currentTime + dur);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctxA.destination);

      noise.start();
    }

    function drawCrosshair() {
      const w = canvas.width;
      const h = canvas.height;
      const mx = Math.max(0, Math.min(w, mouse.x));
      const my = Math.max(0, Math.min(h, mouse.y));

      // Detect if crosshair is over an enemy
      let lockedEnemy = null;
      for (const e of enemies) {
        const dx = mx - e.x;
        const dy = my - e.y;
        const dist = Math.hypot(dx, dy);
        if (dist < (e.r + 14)) { // within lock radius
          lockedEnemy = e;
          break;
        }
      }

      const now = performance.now();
      const pulse = 0.5 + 0.5 * Math.sin(now / 180); // 0..1
      const baseRadius = 14;
      const radius = baseRadius + (lockedEnemy ? 3 : 2) * pulse;

      ctx.save();
      ctx.translate(mx, my);

      // Choose colors depending on lock state
      const outerColor = lockedEnemy
        ? 'rgba(248,113,113,0.95)'   // red/orange when locked
        : 'rgba(251,146,60,0.9)';    // orange idle

      const innerColor = lockedEnemy
        ? '#f97373'
        : '#fb923c';

      // Outer pulsing circle
      ctx.strokeStyle = outerColor;
      ctx.lineWidth = lockedEnemy ? 2.4 : 2;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.stroke();

      // Inner crosshair
      const arm = 10 + (lockedEnemy ? 2 : 0);
      ctx.strokeStyle = innerColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-arm, 0);
      ctx.lineTo(-3, 0);
      ctx.moveTo(3, 0);
      ctx.lineTo(arm, 0);
      ctx.moveTo(0, -arm);
      ctx.lineTo(0, -3);
      ctx.moveTo(0, 3);
      ctx.lineTo(0, arm);
      ctx.stroke();

      ctx.restore();

      // If locking onto an enemy, draw a Star-Wars-style targeting box around them
      if (lockedEnemy) {
        ctx.save();
        ctx.translate(lockedEnemy.x, lockedEnemy.y);
        const boxSize = lockedEnemy.r * 2.4;
        const half = boxSize / 2;

        ctx.strokeStyle = 'rgba(248,113,113,0.95)';
        ctx.lineWidth = 2;

        // Corner brackets
        const corner = 10;
        // Top-left
        ctx.beginPath();
        ctx.moveTo(-half, -half + corner);
        ctx.lineTo(-half, -half);
        ctx.lineTo(-half + corner, -half);
        // Top-right
        ctx.moveTo(half - corner, -half);
        ctx.lineTo(half, -half);
        ctx.lineTo(half, -half + corner);
        // Bottom-right
        ctx.moveTo(half, half - corner);
        ctx.lineTo(half, half);
        ctx.lineTo(half - corner, half);
        // Bottom-left
        ctx.moveTo(-half + corner, half);
        ctx.lineTo(-half, half);
        ctx.lineTo(-half, half - corner);
        ctx.stroke();

        ctx.restore();
      }
    }

    


    function drawLevelUpOverlay() {
      if (levelUpTimer <= 0) return;
      const w = canvas.width;
      const h = canvas.height;
      const t = 1 - (levelUpTimer / 0.8); // 0 -> 1 over life
      const alpha = 0.7 * (1 - t);

      ctx.save();
      ctx.globalAlpha = alpha;
      const grad = ctx.createLinearGradient(w/2 - 160, h/2 - 40, w/2 + 160, h/2 + 40);
      grad.addColorStop(0, '#22c55e');
      grad.addColorStop(0.5, '#a3e635');
      grad.addColorStop(1, '#38bdf8');
      ctx.fillStyle = grad;
      ctx.font = 'bold 40px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('LEVEL UP!', w/2, h/2 - 4);

      ctx.globalAlpha = alpha * 0.9;
      ctx.fillStyle = '#e5e7eb';
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillText('Level ' + level, w/2, h/2 + 24);

      ctx.restore();
    }

    function drawGameOverOverlay() {
      if (running) return;
      const w = canvas.width;
      const h = canvas.height;

      ctx.save();
      ctx.fillStyle = 'rgba(15,23,42,0.82)';
      ctx.fillRect(0, 0, w, h);

      const t = performance.now() / 200;
      const alpha = 0.55 + 0.45 * Math.sin(t);
      ctx.globalAlpha = alpha;

      const grad = ctx.createLinearGradient(w/2 - 180, h/2 - 60, w/2 + 180, h/2 + 60);
      grad.addColorStop(0, '#f97316');
      grad.addColorStop(0.5, '#fde047');
      grad.addColorStop(1, '#f97373');
      ctx.fillStyle = grad;
      ctx.font = 'bold 52px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('MISSION FAILED', w/2, h/2 - 18);

      ctx.globalAlpha = 1;
      ctx.fillStyle = '#e5e7eb';
      ctx.font = '22px system-ui, sans-serif';
      ctx.fillText('GAME OVER', w/2, h/2 + 10);
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillText('You were hit 10 times.', w/2, h/2 + 34);
      ctx.restore();
    }

    // --- Main draw ---
    function draw(timeNow) {
      drawBackground(timeNow);

      // Draw player ship
      drawXWing(player);

      // Enemies
      for (const e of enemies) {
        if (e.kind === 'stealth') {
          drawStealthFighter(e, timeNow);
        } else {
          drawTIEFighter(e, timeNow);
        }
      }

      // Ejectees
      for (const ev of ejectees) {
        drawEjectee(ev);
      }

      // Lasers
      drawLasers();

      // Explosions
      drawExplosions();

      // Player eject ending (if game over triggered)
      drawPlayerEjectee();

      // Crosshair at mouse position for aiming
      drawCrosshair();

      // LEVEL UP overlay (if active)
      drawLevelUpOverlay();

      // Cinematic zoom & dim focus on ejecting pilot when game over
      drawPlayerEjectCinematic();

      // GAME OVER overlay
      drawGameOverOverlay();
    }

    // --- Game loop ---
    let lastTime = performance.now();
    function loop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      update(dt, now);
      draw(now);

      requestAnimationFrame(loop);
    }

    // Initial HUD + start
    hpDisplay.textContent = MAX_HITS;
    hitsDisplay.textContent = "0 / " + MAX_HITS;
    scoreDisplay.textContent = "0";
    if (shipsDisplay) shipsDisplay.textContent = '0';
    if (levelDisplay) { levelDisplay.textContent = level; levelDisplay.classList.add('level-low'); }
    updateShieldBar();
    loadLeaderboard();
    lastEnemySpawn = performance.now();
    requestAnimationFrame(loop);
  

    
    // Mobile joystick: thumb movement, tap screen to shoot
    const joystickBase = document.getElementById('joystickBase');
    const joystickKnob = document.getElementById('joystickKnob');

    let joyActive = false;
    let joyPointerId = null;

    function resetJoystick() {
      if (!joystickKnob) return;
      joystickKnob.style.transform = 'translate(-50%, -50%)';
      keys['arrowleft'] = false;
      keys['arrowright'] = false;
      keys['arrowup'] = false;
      keys['arrowdown'] = false;
    }

    function handleJoystickMove(e) {
      if (!joystickBase || !joystickKnob) return;
      const rect = joystickBase.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const clientX = e.clientX ?? (e.touches && e.touches[0].clientX);
      const clientY = e.clientY ?? (e.touches && e.touches[0].clientY);
      if (clientX == null || clientY == null) return;

      let dx = clientX - cx;
      let dy = clientY - cy;

      const maxRadius = rect.width * 0.35;
      const dist = Math.hypot(dx, dy) || 1;
      if (dist > maxRadius) {
        const scale = maxRadius / dist;
        dx *= scale;
        dy *= scale;
      }

      // Move knob
      const offsetX = dx;
      const offsetY = dy;
      joystickKnob.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;

      // Decide movement directions with a deadzone
      const dead = maxRadius * 0.25;
      keys['arrowleft'] = dx < -dead;
      keys['arrowright'] = dx > dead;
      keys['arrowup'] = dy < -dead;
      keys['arrowdown'] = dy > dead;
    }

    if (joystickBase) {
      joystickBase.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        joyActive = true;
        joyPointerId = e.pointerId;
        joystickBase.setPointerCapture(e.pointerId);
        handleJoystickMove(e);
      });
      joystickBase.addEventListener('pointermove', (e) => {
        if (!joyActive || e.pointerId !== joyPointerId) return;
        e.preventDefault();
        handleJoystickMove(e);
      });
      joystickBase.addEventListener('pointerup', (e) => {
        if (e.pointerId !== joyPointerId) return;
        e.preventDefault();
        joyActive = false;
        joyPointerId = null;
        resetJoystick();
      });
      joystickBase.addEventListener('pointercancel', (e) => {
        if (e.pointerId !== joyPointerId) return;
        joyActive = false;
        joyPointerId = null;
        resetJoystick();
      });
      joystickBase.addEventListener('pointerleave', (e) => {
        if (!joyActive || e.pointerId !== joyPointerId) return;
        joyActive = false;
        joyPointerId = null;
        resetJoystick();
      });
    }

</script>
</body>
